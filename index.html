<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>BILL APP</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0F3D75">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BILL APP">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
<noscript><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --ink:#0F3D75;
    --ink-light:#1B4E8F;
    --green:#2563EB;
    --green-light:#4F8EF7;
    --paper:#F3F8FF;
    --paper-dark:#E4EDFB;
    --amber:#F5A623;
    --red:#DC3D3D;
    --text:#14213D;
    --text-dim:#5C7089;
    --line:#D9E4F5;
    --white:#FFFFFF;
    --shadow-sm:0 1px 2px rgba(15,61,117,.06), 0 1px 3px rgba(15,61,117,.08);
    --shadow-md:0 4px 12px rgba(15,61,117,.10), 0 2px 4px rgba(15,61,117,.06);
    --shadow-lg:0 12px 32px rgba(15,61,117,.16), 0 4px 10px rgba(15,61,117,.08);
    --radius-sm:8px;
    --radius-md:12px;
    --radius-lg:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%;}
  body{margin:0;padding:0;background:transparent;}
  #app{
    font-family:'Plus Jakarta Sans',sans-serif;
    color:var(--text);
    background:var(--paper);
    min-height:100vh;
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
    text-rendering:optimizeLegibility;
  }
  .mono{font-family:'JetBrains Mono',monospace;}
  button{font-family:inherit;cursor:pointer;touch-action:manipulation;}
  input,select,textarea{font-family:inherit;touch-action:manipulation;}
  a{touch-action:manipulation;}
  ::selection{background:var(--amber);color:var(--ink);}
  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-track{background:transparent;}
  ::-webkit-scrollbar-thumb{background:rgba(92,112,137,.28);border-radius:20px;}
  ::-webkit-scrollbar-thumb:hover{background:rgba(92,112,137,.45);}

  /* ---------- LOGIN ---------- */
  .login-wrap{
    flex:1;display:flex;align-items:center;justify-content:center;
    background:
      radial-gradient(circle at 15% 8%, rgba(37,99,235,.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(245,166,35,.10), transparent 40%),
      repeating-linear-gradient(135deg, rgba(20,33,61,0.03) 0 2px, transparent 2px 14px),
      var(--paper);
    padding:24px;
    padding-top:calc(24px + env(safe-area-inset-top));
    padding-bottom:calc(24px + env(safe-area-inset-bottom));
  }
  .login-card{
    background:var(--white);
    border:1px solid var(--line);
    border-radius:var(--radius-lg);
    width:100%;max-width:380px;
    padding:34px 28px 28px;
    box-shadow:var(--shadow-lg);
    position:relative;
    animation:login-rise .4s cubic-bezier(.2,.8,.2,1);
  }
  @keyframes login-rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .login-card::before{
    content:"";
    position:absolute; top:-1px; left:20px; right:20px; height:8px;
    background: radial-gradient(circle at 6px 0, transparent 5px, var(--paper) 5.5px) repeat-x;
    background-size:16px 8px;
  }
  .login-card::after{
    content:"";position:absolute;top:0;left:0;right:0;height:4px;
    border-radius:var(--radius-lg) var(--radius-lg) 0 0;
    background:linear-gradient(90deg,var(--green),var(--amber));
  }
  .brand{display:flex;align-items:baseline;gap:8px;margin-bottom:4px;}
  .brand .mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:22px;color:var(--green);}
  .brand .name{font-weight:800;font-size:20px;letter-spacing:-0.02em;color:var(--ink);}
  .tagline{color:var(--text-dim);font-size:13px;margin-bottom:24px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--text-dim);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}
  .field input,.field select{
    width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);
    font-size:16px;background:var(--white);color:var(--text);
    transition:border-color .15s ease, box-shadow .15s ease;
  }
  .field input:focus,.field select:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .suggest-drop{
    position:absolute;top:100%;left:0;right:0;margin-top:4px;
    background:var(--white);border:1.5px solid var(--line);border-radius:var(--radius-sm);
    box-shadow:var(--shadow-md);max-height:190px;overflow-y:auto;z-index:15;display:none;
  }
  .suggest-drop.open{display:block;}
  .suggest-item{
    padding:8px 12px;cursor:pointer;font-size:13.5px;
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
    border-bottom:1px solid var(--line);
  }
  .suggest-item:last-child{border-bottom:none;}
  .suggest-item:hover{background:var(--paper);}
  .suggest-item .snm{font-weight:600;color:var(--text);}
  .suggest-item .sph{font-size:11.5px;color:var(--text-dim);white-space:nowrap;}
  .btn{
    border:none;border-radius:var(--radius-sm);padding:12px 18px;font-weight:700;font-size:14.5px;
    letter-spacing:.02em;transition:transform .08s ease, filter .15s ease, box-shadow .15s ease, background .15s ease;
    min-height:44px;box-shadow:var(--shadow-sm);
  }
  .btn:active{transform:translateY(1px);box-shadow:none;}
  .btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;}
  .btn-primary{background:linear-gradient(180deg,var(--green-light),var(--green));color:var(--white);}
  .btn-primary:hover{filter:brightness(1.06);box-shadow:var(--shadow-md);}
  .btn-block{width:100%;}
  .btn-amber{background:var(--amber);color:var(--ink);}
  .btn-amber:hover{filter:brightness(1.05);box-shadow:var(--shadow-md);}
  .btn-ghost{background:var(--white);color:var(--ink);border:1.5px solid var(--line);box-shadow:none;}
  .btn-ghost:hover{border-color:var(--green);color:var(--green);}
  .btn-danger{background:var(--red);color:var(--white);}
  .btn-danger:hover{filter:brightness(1.05);}
  .btn-sm{padding:6px 10px;font-size:12.5px;border-radius:7px;min-height:32px;}
  .error-msg{color:var(--red);font-size:13px;margin:-4px 0 12px;}
  .demo-hint{margin-top:18px;padding:10px 12px;background:var(--paper);border-radius:var(--radius-sm);font-size:11.5px;color:var(--text-dim);border:1px dashed var(--line);}
  .demo-hint b{color:var(--text);}
  .boot-fail-banner{
    display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
    background:#FDF1E3;border-bottom:1px solid var(--amber);
    color:var(--ink);padding:10px 20px;font-size:13px;line-height:1.4;
  }
  .boot-fail-banner b{color:var(--red);}

  /* ---------- BOOT LOADING SCREEN ---------- */
  .boot-loading-screen{
    min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:20px;text-align:center;padding:24px;
    background:
      radial-gradient(circle at 15% 8%, rgba(37,99,235,.10), transparent 45%),
      radial-gradient(circle at 88% 92%, rgba(245,166,35,.10), transparent 40%),
      var(--paper);
  }
  .boot-loading-screen .brand{display:flex;align-items:baseline;gap:8px;}
  .boot-loading-screen .mark{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;color:var(--green);}
  .boot-loading-screen .name{font-weight:800;font-size:22px;letter-spacing:-0.02em;color:var(--ink);}
  .boot-spinner{width:38px;height:38px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--green);animation:boot-spin .8s linear infinite;}
  @keyframes boot-spin{to{transform:rotate(360deg);}}
  .boot-loading-screen .msg{font-size:13.5px;color:var(--text-dim);}

  /* ---------- SHELL ---------- */
  .topbar{
    background:linear-gradient(180deg,var(--ink-light),var(--ink));color:var(--white);
    display:flex;align-items:center;justify-content:space-between;
    padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top));
    position:sticky;top:0;z-index:20;box-shadow:0 2px 10px rgba(15,61,117,.18);
  }
  .topbar .brand2{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;}
  .topbar .brand2 .mark{font-family:'JetBrains Mono',monospace;color:var(--amber);}
  .who{display:flex;align-items:center;gap:10px;font-size:13px;}
  .who .role-badge{
    background:var(--green);color:var(--white);font-size:10px;font-weight:700;
    padding:2px 7px;border-radius:10px;text-transform:uppercase;letter-spacing:.03em;
  }
  .logout-btn{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.3);color:var(--white);
    padding:6px 12px;border-radius:7px;font-size:12.5px;transition:background .15s ease;min-height:34px;}
  .logout-btn:hover{background:rgba(255,255,255,.16);}

  .layout{display:flex;flex:1;min-height:0;}
  .sidebar{
    width:190px;flex-shrink:0;background:linear-gradient(180deg,var(--ink-light),#163f70);color:var(--white);
    padding:16px 10px;display:flex;flex-direction:column;gap:3px;
    box-shadow:2px 0 10px rgba(15,61,117,.10);
  }
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);
    color:rgba(255,255,255,.75);font-size:14px;font-weight:600;background:transparent;border:none;
    text-align:left;width:100%;transition:background .15s ease,color .15s ease;
  }
  .nav-item svg{width:16px;height:16px;flex-shrink:0;}
  .nav-item:hover{background:rgba(255,255,255,.08);color:var(--white);}
  .nav-item.active{background:var(--green);color:var(--white);box-shadow:var(--shadow-sm);}
  .nav-divider{height:1px;background:rgba(255,255,255,.12);margin:10px 4px;}
  .nav-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:rgba(255,255,255,.4);padding:8px 12px 2px;}

  .content{flex:1;min-width:0;padding:22px;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  .page-title{font-size:22px;font-weight:800;color:var(--ink);letter-spacing:-0.01em;margin:0 0 4px;}
  .page-sub{color:var(--text-dim);font-size:13.5px;margin:0 0 20px;}

  .card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:16px;box-shadow:var(--shadow-sm);overflow-x:auto;}
  .grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px;align-items:start;}
  .card.cash-highlight{border:1.5px solid var(--green);background:linear-gradient(180deg,rgba(37,99,235,.06),rgba(37,99,235,0) 40%);box-shadow:0 2px 10px rgba(37,99,235,.12);}
  .card.cash-highlight .section-head h3{font-size:18px;font-weight:800;color:var(--green);}
  .card.cash-highlight table thead th{background:rgba(37,99,235,.08);}
  .card.cash-highlight table td:last-child{font-size:15px;}
  .card.highlight-amber{border:1.5px solid var(--amber);background:linear-gradient(180deg,rgba(245,166,35,.09),rgba(245,166,35,0) 40%);box-shadow:0 2px 10px rgba(245,166,35,.14);}
  .card.highlight-amber .section-head h3{font-size:17px;font-weight:800;color:#B4720C;}
  .card.highlight-amber table thead th{background:rgba(245,166,35,.12);}
  .card.highlight-ink{border:1.5px solid var(--ink-light);background:linear-gradient(180deg,rgba(27,78,143,.07),rgba(27,78,143,0) 40%);box-shadow:0 2px 10px rgba(27,78,143,.12);}
  .card.highlight-ink .section-head h3{font-size:17px;font-weight:800;color:var(--ink-light);}
  .card.highlight-ink table thead th{background:rgba(27,78,143,.08);}
  .card.highlight-red{border:1.5px solid var(--red);background:linear-gradient(180deg,rgba(220,61,61,.07),rgba(220,61,61,0) 40%);box-shadow:0 2px 10px rgba(220,61,61,.12);}
  .card.highlight-red .section-head h3{font-size:17px;font-weight:800;color:var(--red);}
  .card.highlight-red table thead th{background:rgba(220,61,61,.08);}

  /* ---------- BILLING: items ---------- */
  .search-row{display:flex;gap:8px;margin-bottom:14px;}
  .search-row input{flex:1;padding:10px 12px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:14px;transition:border-color .15s ease, box-shadow .15s ease;}
  .search-row input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .item-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;}
  .item-tile{
    border:1.5px solid var(--line);border-radius:var(--radius-md);padding:12px 12px 10px;background:var(--white);
    text-align:left;position:relative;overflow:hidden;transition:border-color .15s ease, box-shadow .15s ease, transform .1s ease;
    box-shadow:var(--shadow-sm);
  }
  .item-tile:disabled{opacity:.45;cursor:not-allowed;box-shadow:none;}
  .item-tile:not(:disabled):hover{border-color:var(--green);box-shadow:var(--shadow-md);}
  .item-tile:not(:disabled):active{transform:scale(.97);}
  .item-tile .nm{font-weight:700;font-size:13.5px;color:var(--ink);margin-bottom:6px;display:block;}
  .item-tile .pr{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--green);font-size:14.5px;}
  .item-tile .st{font-size:11px;color:var(--text-dim);margin-top:4px;}
  .item-tile .st.low{color:var(--red);font-weight:700;}
  .cat-tag{position:absolute;top:8px;right:8px;font-size:9px;background:var(--paper-dark);color:var(--text-dim);
    padding:2px 6px;border-radius:8px;text-transform:uppercase;letter-spacing:.03em;}
  .item-thumb{width:100%;height:64px;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:8px;background:var(--paper-dark);
    display:flex;align-items:center;justify-content:center;}
  .item-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .item-thumb-placeholder{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;color:var(--text-dim);}
  .thumb-sm{width:34px;height:34px;border-radius:var(--radius-sm);overflow:hidden;flex-shrink:0;background:var(--paper-dark);
    display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:13px;color:var(--text-dim);}
  .thumb-sm img{width:100%;height:100%;object-fit:cover;display:block;}
  .logo-preview{max-width:160px;max-height:70px;border:1px solid var(--line);border-radius:var(--radius-sm);background:var(--white);padding:4px;display:block;margin-bottom:8px;}
  .r-logo{max-width:70%;max-height:60px;margin:0 auto 6px;display:block;}

  /* ---------- THEME SWATCHES ---------- */
  .theme-swatch-row{display:flex;flex-wrap:wrap;gap:10px;}
  .theme-swatch{
    width:34px;height:34px;border-radius:50%;border:2.5px solid var(--white);
    box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0;flex-shrink:0;
    transition:transform .1s ease, box-shadow .15s ease;
  }
  .theme-swatch:hover{transform:scale(1.08);}
  .theme-swatch.active{box-shadow:0 0 0 2.5px var(--ink);}

  /* ---------- CART ---------- */
  .cart-box{position:sticky;top:8px;}
  .cart-title{font-weight:800;font-size:15px;color:var(--ink);margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;}
  .cart-empty{color:var(--text-dim);font-size:13px;text-align:center;padding:26px 10px;border:1.5px dashed var(--line);border-radius:var(--radius-sm);}
  .cart-line{display:flex;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);}
  .cart-line .nm{flex:1;font-size:13px;font-weight:600;}
  .qty-ctrl{display:flex;align-items:center;gap:6px;}
  .qty-ctrl button{width:28px;height:28px;border:1px solid var(--line);background:var(--paper);border-radius:7px;font-weight:700;font-size:14px;line-height:1;transition:background .15s ease,border-color .15s ease;}
  .qty-ctrl button:hover{background:var(--paper-dark);border-color:var(--green);}
  .qty-ctrl span{width:22px;text-align:center;font-family:'JetBrains Mono',monospace;font-size:13px;}
  .qty-ctrl input.qty-input{
    width:38px;height:28px;text-align:center;padding:0 2px;
    border:1px solid var(--line);border-radius:7px;background:var(--white);
    font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text);
    -moz-appearance:textfield;
  }
  .qty-ctrl input.qty-input::-webkit-outer-spin-button,
  .qty-ctrl input.qty-input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
  .qty-ctrl input.qty-input:focus{outline:none;border-color:var(--green);box-shadow:0 0 0 3px rgba(37,99,235,.14);}
  .line-total{width:64px;text-align:right;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:700;}
  .rm-btn{color:var(--red);background:none;border:none;font-size:18px;padding:4px 6px;min-height:32px;min-width:32px;border-radius:7px;transition:background .15s ease;}
  .rm-btn:hover{background:rgba(220,61,61,.1);}

  .sum-row{display:flex;justify-content:space-between;font-size:13.5px;padding:4px 0;color:var(--text-dim);}
  .sum-row.total{font-size:17px;font-weight:800;color:var(--ink);border-top:1.5px dashed var(--line);margin-top:6px;padding-top:10px;}
  .sum-row .val{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--text);}
  .sum-row.total .val{color:var(--green);}

  .discount-row{display:flex;gap:6px;align-items:center;margin:10px 0;}
  .discount-row select{padding:8px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:12.5px;}
  .discount-row input{width:80px;padding:8px;border:1.5px solid var(--line);border-radius:var(--radius-sm);font-size:13px;}

  .pay-tabs{display:flex;gap:6px;margin:12px 0 8px;}
  .pay-tab{flex:1;padding:9px 4px;border:1.5px solid var(--line);border-radius:var(--radius-sm);background:var(--white);
    font-size:12px;font-weight:700;color:var(--text-dim);transition:background .15s ease,color .15s ease,border-color .15s ease;min-height:38px;}
  .pay-tab.active{background:var(--ink);color:var(--white);border-color:var(--ink);}

  /* ---------- TABLES ---------- */
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--text-dim);
    padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap;}
  td{padding:9px 10px;border-bottom:1px solid var(--line);}
  tr:last-child td{border-bottom:none;}
  tbody tr{transition:background .1s ease;}
  tbody tr:hover{background:var(--paper);}
  .num{font-family:'JetBrains Mono',monospace;}
  .pill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:9px;text-transform:uppercase;}
  .pill.cash{background:#DFF0E6;color:var(--green);}
  .pill.cheque{background:#FDF0DA;color:#8A5E12;}
  .pill.account{background:#FBE3E1;color:var(--red);}
  .pill.paid{background:#DCEBFF;color:var(--green);}
  .pill.partial{background:#FDF0DA;color:#8A5E12;}
  .pill.unpaid{background:#FBE3E1;color:var(--red);}
  .acct-row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .edit-line{display:flex;gap:6px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
  .edit-line input{padding:6px 8px;border:1.5px solid var(--line);border-radius:4px;font-size:13px;}
  .edit-line .en{flex:1;}
  .edit-line .eq{width:56px;}
  .edit-line .ep{width:80px;}

  /* ---------- STAT CARDS ---------- */
  .stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px;}
  .stat-card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm);transition:box-shadow .15s ease,transform .15s ease;}
  .stat-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);}

      try{ return _toLocaleDateString.call(this, locales, options); }
      catch(e){ return _toLocaleDateString.call(this, locales, (options && options.timeZone===TZ) ? undefined : options); }
    };
    Date.prototype.toLocaleTimeString = function(locales, options){
      options = options ? Object.assign({}, options) : {};
      if(!options.timeZone) options.timeZone = TZ;
      try{ return _toLocaleTimeString.call(this, locales, options); }
      catch(e){ return _toLocaleTimeString.call(this, locales, (options && options.timeZone===TZ) ? undefined : options); }
    };
  })();

  function uid(prefix){ return prefix+'_'+Math.random().toString(36).slice(2,9); }
  function money(n){ return state.shop.currency+' '+ (Math.round(n*100)/100).toFixed(2); }
  // Printing is a shop-wide on/off switch (Admin > Shop settings). When off,
  // every print button/flow is hidden across the app — sharing a bill as a
  // photo is unaffected, since that's not "printing".
  function printingEnabled(){ return state.shop.printingEnabled !== false; }
  // "Today" is the Sri Lanka calendar day (GMT+5:30), not the UTC day —
  // otherwise "today" filters would flip over at 5:30am local time instead
  // of midnight.
  function todayISO(){
    try{
      return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Colombo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date());
    }catch(e){
      // Fallback for devices/WebViews without Asia/Colombo tz data.
      var d = new Date();
      return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    }
  }
  // Converts a full ISO timestamp (e.g. a bill's dateISO, stored via
  // new Date().toISOString() which is UTC) to the Sri Lanka calendar day
  // it falls on. Without this, a bill made between midnight and 5:30am
  // Sri Lanka time — still UTC "yesterday" — would get grouped, filtered,
  // and totaled under the wrong day everywhere reports/accounts/stock
  // break things down by day (it would also not show up in "Today").
  // Safe to call on a bare "YYYY-MM-DD" string too (parsed as UTC
  // midnight, which the +5:30 offset never rolls into the next day).
  function localDay(dateISOStr){
    if(!dateISOStr) return '';
    try{
      return new Intl.DateTimeFormat('en-CA', {timeZone:'Asia/Colombo', year:'numeric', month:'2-digit', day:'2-digit'}).format(new Date(dateISOStr));
    }catch(e){
      return (dateISOStr||'').slice(0,10);
    }
  }
  function monthKey(dateISOStr){ return localDay(dateISOStr).slice(0,7); }

  // =====================================================================
  // STOCK PURCHASE-PRICE BATCHES
  // Every time stock is added it's recorded as its own "batch" with the
  // purchase price paid for it. Older batches are never touched or
  // rewritten by a later restock — only the new batch gets the new price.
  // The selling price (item.price) is never part of a batch: it's a
  // single field on the item, so it's always identical across all stock
  // of that item no matter how many different purchase prices exist.
  // =====================================================================
  function ensureItemBatches(item){
    if(!item.batches){
      item.batches = item.stock>0 ? [{
        id: uid('b'), qty: item.stock,
        purchasePrice: (typeof item.purchasePrice==='number') ? item.purchasePrice : 0,
        dateISO: new Date().toISOString()
      }] : [];
    }
    if(typeof item.purchasePrice !== 'number'){
      item.purchasePrice = item.batches.length ? item.batches[item.batches.length-1].purchasePrice : 0;
    }
    return item;
  }
  // Most recently added batch's purchase price — used to prefill the
  // Restock form and as a fallback cost when a sale outsells tracked batches.
  function itemLastPurchasePrice(item){
    ensureItemBatches(item);
    if(!item.batches.length) return (typeof item.purchasePrice==='number') ? item.purchasePrice : null;
    var sorted = item.batches.slice().sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); });
    return sorted[0].purchasePrice;
  }
  // Consumes `qty` units from an item's oldest batches first (FIFO),
  // decrementing item.stock and returning the total cost of the units
  // consumed — this is what Profit is calculated from. If a sale outsells
  // every tracked batch (e.g. legacy stock from before this feature), the
  // remainder is costed at the last known purchase price.
  function consumeStockFIFO(item, qty){
    ensureItemBatches(item);
    var remaining = qty, cost = 0;
    item.batches.sort(function(a,b){ return new Date(a.dateISO)-new Date(b.dateISO); });
    for(var i=0;i<item.batches.length && remaining>0;i++){
      var b = item.batches[i];
      var take = Math.min(b.qty, remaining);
      cost += take * (b.purchasePrice||0);
      b.qty -= take;
      remaining -= take;
    }
    item.batches = item.batches.filter(function(b){ return b.qty>0; });
    if(remaining>0) cost += remaining * (item.purchasePrice||0);
    item.stock = Math.max(0, item.stock - qty);
    return cost;
  }

  // =====================================================================
  // BLUETOOTH THERMAL PRINTER (ESC/POS over Web Bluetooth)
  // Most 58mm "Bluetooth" receipt printers are actually BLE (not classic
  // SPP), so the OS print dialog from window.print() never reaches them —
  // that's the usual cause of "not printing / not connecting". Instead we
  // talk to the printer directly with raw ESC/POS commands over a BLE
  // write characteristic, the same way the printer's companion app does.
  // =====================================================================
  var PRINTER_STORE_KEY = 'pos:printerName';
  var PRINTER_OPTIONAL_SERVICES = [
    '000018f0-0000-1000-8000-00805f9b34fb',
    '49535343-fe7d-4ae5-8fa9-9fafd205e455',
    '0000ffe0-0000-1000-8000-00805f9b34fb',
    '0000ff00-0000-1000-8000-00805f9b34fb',
    'e7810a71-73ae-499d-8c15-faa9aef0c3f2'
  ];

  function bluetoothSupported(){
    return !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
  }

  // Shared by the initial pairing connect and every auto-reconnect attempt,
  // so both paths discover the write characteristic the same way.
  async function findWritableCharacteristic(server){
    var characteristic = null;
    var services = await server.getPrimaryServices();
    outer:
    for(var i=0;i<services.length;i++){
      var chars = await services[i].getCharacteristics();
      for(var j=0;j<chars.length;j++){
        var c = chars[j];
        if(c.properties.write || c.properties.writeWithoutResponse){
          characteristic = c;
          break outer;
        }
      }
    }
    return characteristic;
  }

  // Re-attaches to a printer we (or the browser) already have permission
  // for, without showing the device chooser again. Used both when the
  // connection drops mid-session (e.g. printer went briefly out of range)
  // and, opportunistically, right after page load if the browser kept
  // permission for a previously-paired printer. Retries a few times with
  // a short backoff since BLE reconnects sometimes fail on the first try
  // even when the printer is right there.
  var reconnecting = false;
  // How long to wait between reconnect attempts. Configurable in Printer
  // Settings (2s–10s, default 3s) so a person can tune it for how far
  // their printer tends to wander out of Bluetooth range before it's
  // worth retrying again.
  function printerReconnectDelayMs(){
    var sec = Number(state.shop && state.shop.printerReconnectDelaySec);
    if(!sec || isNaN(sec)) sec = 3;
    sec = Math.max(2, Math.min(10, sec));
    return sec * 1000;
  }
  async function attemptAutoReconnect(device, maxAttempts){
    if(reconnecting) return false;
    reconnecting = true;
    maxAttempts = maxAttempts || 3;
    for(var i=0;i<maxAttempts;i++){
      try{
        state.printer.status = 'Reconnecting to '+(device.name||'printer')+(i>0?' (attempt '+(i+1)+')':'')+'…';
        render();
        var server = await device.gatt.connect();
        var characteristic = await findWritableCharacteristic(server);
        if(!characteristic) throw new Error('No writable characteristic found.');
        state.printer.device = device;
        state.printer.characteristic = characteristic;
        state.printer.connected = true;
        state.printer.name = device.name || 'Bluetooth printer';
        state.printer.status = 'Reconnected to '+state.printer.name+'.';
        try{ localStorage.setItem(PRINTER_STORE_KEY, state.printer.name); }catch(e){}
        recordPrinterUsage(state.printer.name);
        requestWakeLock();
        render();
        reconnecting = false;
        return true;
      }catch(e){
        await sleep(printerReconnectDelayMs());
      }
    }
    state.printer.connected = false;
    state.printer.characteristic = null;
    state.printer.status = 'Printer disconnected — tap Connect Printer to reconnect.';
    render();
    reconnecting = false;
    return false;
  }

  // Logs every Bluetooth printer this device has connected to — name,
  // first/last connected time, and a connection count — so it can be
  // mirrored to a "Printers" tab in the Sheet. Fire-and-forget: never
  // blocks the print/connect flow, and failures here are harmless.
  function recordPrinterUsage(name){
    if(!name) return;
    var nowISO = new Date().toISOString();
    var rec = state.printerHistory.find(function(p){ return p.name===name; });
    if(rec){
      rec.lastConnected = nowISO;
      rec.timesConnected = (rec.timesConnected||0) + 1;
    } else {
      state.printerHistory.push({ name:name, firstConnected:nowISO, lastConnected:nowISO, timesConnected:1 });
    }
    storageSet(STORE_KEY_PRINTERS, state.printerHistory).then(function(ok){
      if(ok) syncReadableSheets();
    });
  }

  function watchForDrop(device){
    device.addEventListener('gattserverdisconnected', function(){
      state.printer.connected = false;
      state.printer.characteristic = null;
      // Try to reattach automatically first; only ask for a manual tap
      // if that genuinely fails (attemptAutoReconnect sets that status).
      attemptAutoReconnect(device, 3);
    });
  }

  async function connectPrinter(){
    if(!bluetoothSupported()){
      state.printer.status = 'This browser/device does not support Bluetooth printing. Use Chrome on Android, or use "Print (browser)" instead.';
      render();
      return;
    }
    try{
      state.printer.status = 'Choose your printer from the list…';
      render();
      var device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: PRINTER_OPTIONAL_SERVICES
      });
      state.printer.status = 'Connecting to '+device.name+'…';
      render();
      var server = await device.gatt.connect();
      var characteristic = await findWritableCharacteristic(server);
      if(!characteristic) throw new Error('No writable characteristic found on this printer.');
      watchForDrop(device);
      state.printer.device = device;
      state.printer.characteristic = characteristic;
      state.printer.connected = true;
      state.printer.name = device.name || 'Bluetooth printer';
      state.printer.status = 'Connected to '+state.printer.name+'.';
      try{ localStorage.setItem(PRINTER_STORE_KEY, state.printer.name); }catch(e){}
      recordPrinterUsage(state.printer.name);
      requestWakeLock();
      render();
    }catch(e){
      state.printer.status = 'Could not connect: '+(e.message||e);
      render();
    }
  }

  // On boot, if this browser kept Bluetooth permission for a previously
  // paired printer (Chrome on Android persists this across page loads),
  // reattach to it silently — no device chooser, no tap needed. If the
  // browser doesn't support this (e.g. permission was only session-scoped)
  // this quietly does nothing and the person just taps Connect once, same
  // as before.
  async function trySilentReconnect(){
    try{
      if(!navigator.bluetooth || !navigator.bluetooth.getDevices) return false;
      var devices = await navigator.bluetooth.getDevices();
      if(!devices || !devices.length) return false;
      var lastName = null;
      try{ lastName = localStorage.getItem(PRINTER_STORE_KEY); }catch(e){}
      var device = (lastName && devices.find(function(d){ return d.name===lastName; })) || devices[0];
      watchForDrop(device);
      return await attemptAutoReconnect(device, 2);
    }catch(e){ return false; /* fall back to manual Connect — no harm done */ }
  }

  // ---------------------------------------------------------------------
  // KEEPING BLUETOOTH ALIVE WHILE THE APP IS OPEN
  // No web app (installed or not) can hold a Bluetooth connection open
  // once the phone's screen is off or the app is fully backgrounded —
  // that's an OS/browser battery-saving rule, not something this app can
  // override. What we *can* do is make the connection as resilient as
  // possible while the app is on screen:
  //   1. A screen Wake Lock stops the display (and the JS that depends on
  //      it) from sleeping while a printer is connected.
  //   2. When the app regains focus (user switches back to it, or the
  //      screen turns back on), we immediately try to silently reattach
  //      to the last known printer instead of waiting for a print button.
  // ---------------------------------------------------------------------
  var wakeLock = null;
  async function requestWakeLock(){
    try{
      if(!('wakeLock' in navigator)) return;
      if(wakeLock) return;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', function(){ wakeLock = null; });
    }catch(e){ /* user denied / unsupported — silently ignore */ }
  }
  function releaseWakeLock(){
    try{ if(wakeLock){ wakeLock.release(); wakeLock = null; } }catch(e){}
  }

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'visible'){
      if(state.printer.connected) requestWakeLock();
      if(!state.printer.connected && state.printer.device && !reconnecting){
        attemptAutoReconnect(state.printer.device, 2);
      }
    } else {
      // Screen lock / app switch — nothing more we can do here; the BLE
      // link will likely drop and gattserverdisconnected (see
      // watchForDrop) will fire the moment it does, or on return.
      releaseWakeLock();
    }
  });

          dateISO: new Date().toISOString(),
          billNo: bill.no||'',
          billDateISO: bill.dateISO||'',
          customerName: bill.customerName||'',
          customerPhone: bill.customerPhone||'',
          total: bill.total||0,
          payment: bill.payment||'',
          items: (bill.items||[]).map(function(it){ return {name:it.name, qty:it.qty}; }),
          deletedBy: state.currentUser.name
        });
        state.bills = state.bills.filter(function(b){ return b.id!==id; });
        if(state.payFormOpenId===id) state.payFormOpenId=null;
        if(state.billEditForm && state.billEditForm.billId===id) state.billEditForm=null;
        state.busyMsg = 'Deleting bill…';
        render();
        await persist('bills'); await persist('items'); await persist('deletedBills');
        state.busyMsg = '';
        render();
      });
    });
  }

  function disconnectPrinter(){

  // ---- ESC/POS buffer building ----
  var ESC = 0x1B, GS = 0x1D;
  function textToBytes(str){
    var bytes = [];
    for(var i=0;i<str.length;i++){
      var code = str.charCodeAt(i);
      bytes.push(code>255 ? 63 : code); // 63 = '?' fallback for unsupported chars
    }
    return bytes;
  }
  function padLine(left, right, width){
    var space = width - String(left).length - String(right).length;
    if(space<1) space=1;
    return left + new Array(space+1).join(' ') + right;
  }
  function wrapText(str, width){
    var words = String(str).split(' ');
    var lines = [], cur = '';
    words.forEach(function(w){
      if((cur+' '+w).trim().length > width){ lines.push(cur.trim()); cur = w; }
      else cur = (cur+' '+w).trim();
    });
    if(cur) lines.push(cur);
    return lines.length ? lines : [''];
  }

  // Cache of the last-computed logo bitmap, keyed by source image + width —
  // the shop logo almost never changes between prints, so re-decoding the
  // image and re-dithering every pixel on every single receipt was wasted
  // work that added noticeable delay before the print even started.
  var logoBytesCache = { key:'', bytes:null };

  // Convert an uploaded logo image into ESC/POS raster bitmap bytes (GS v 0),
  // dithered to 1-bit black/white at the printer's dot width.
  function logoToEscPosBytes(dataUrl, printWidthPx){
    return new Promise(function(resolve){
      if(!dataUrl) return resolve([]);
      var cacheKey = dataUrl+'|'+printWidthPx;
      if(logoBytesCache.key===cacheKey){ resolve(logoBytesCache.bytes); return; }
      var img = new Image();
      img.onload = function(){
        var scale = printWidthPx / img.width;
        var h = Math.max(1, Math.round(img.height*scale));
        var wBytes = Math.ceil(printWidthPx/8);
        var wPacked = wBytes*8;
        var canvas = document.createElement('canvas');
        canvas.width = wPacked; canvas.height = h;
        var ctx = canvas.getContext('2d');
        ctx.fillStyle = '#fff'; ctx.fillRect(0,0,wPacked,h);
        ctx.drawImage(img, 0, 0, printWidthPx, h);
        var data = ctx.getImageData(0,0,wPacked,h).data;
        var bytes = [0x1D,0x76,0x30,0x00, wBytes&0xFF, (wBytes>>8)&0xFF, h&0xFF, (h>>8)&0xFF];
        for(var y=0;y<h;y++){
          for(var xB=0;xB<wBytes;xB++){
            var b=0;
            for(var bit=0;bit<8;bit++){
              var x=xB*8+bit, idx=(y*wPacked+x)*4;
              var lum = data[idx]*0.299+data[idx+1]*0.587+data[idx+2]*0.114;
              if(data[idx+3]>128 && lum<160) b |= (0x80>>bit);
            }
            bytes.push(b);
          }
        }
        logoBytesCache.key = cacheKey;
        logoBytesCache.bytes = bytes;
        resolve(bytes);
      };
      img.onerror = function(){ resolve([]); };
      img.src = dataUrl;
    });
  }


  async function buildReceiptBytes(bill){

    function line(str){ push.apply(null, textToBytes(str)); push(0x0A); }
    function center(on){ push(ESC,0x61,on?1:0); }
    function bold(on){ push(ESC,0x45,on?1:0); }
    function bigSize(on){ push(GS,0x21, on?0x11:0x00); }

  function sleep(ms){ return new Promise(function(res){ setTimeout(res, ms); }); }

  async function writeToPrinter(bytes){
    var ch = state.printer.characteristic;
    if(!ch) throw new Error('No printer connected.');
    var withoutResponse = ch.properties.writeWithoutResponse;
    var i = 0;
    while(i < bytes.length){
      var chunkSize = state.printer.writeChunk;
      var chunk = bytes.slice(i, i+chunkSize);
      try{
        if(withoutResponse){
          await ch.writeValueWithoutResponse(chunk);
          // No ack from the printer, so we still pace writes to avoid
          // overrunning its buffer — but 8ms keeps up with modern printers
          // fine and roughly halves total print time vs the old 20ms.
          await sleep(8);
        } else {
          await ch.writeValue(chunk); // this already waits for the printer's ack, so it's naturally paced — no extra sleep needed
        }
        i += chunkSize;
      }catch(e){
        // This chunk was likely too large for this printer's BLE buffer/MTU.
        // Shrink the chunk size and retry the same bytes instead of failing
        // the whole print — and remember the smaller size so the rest of
        // this print, and future ones, don't hit the same wall repeatedly.
        if(state.printer.writeChunk > 20){
          state.printer.writeChunk = Math.max(20, Math.floor(state.printer.writeChunk/2));
        } else {
          throw e;
        }
      }
    }
  }

  async function printBillToBluetooth(bill){
    if(!state.printer.connected){
      if(state.printer.device){
        var reattached = await attemptAutoReconnect(state.printer.device, 2);
        if(!reattached) return false; // status already set by attemptAutoReconnect
      } else {
        // No device tracked in this page session (e.g. the page was
        // reloaded) — before giving up, check whether the browser still
        // remembers permission for a previously paired printer and try
        // reattaching to that silently.
        var reconnectedSilently = await trySilentReconnect();
        if(!reconnectedSilently || !state.printer.connected){
          state.printer.status = 'No Bluetooth printer connected — tap "Connect Printer" first.';
          render();
          return false;
        }
      }
    }
    try{
      state.printer.status = 'Printing…';
      render();
      var bytes = await buildReceiptBytes(bill);
      await writeToPrinter(bytes);
      state.printer.status = 'Printed to '+state.printer.name+'.';
      render();
      return true;
    }catch(e){
      state.printer.status = 'Print failed: '+(e.message||e)+'. Try reconnecting the printer.';
      render();
      return false;
    }
  }

  // =====================================================================
  // BILL PHOTO SHARE
  // Draws the same receipt content shown on-screen onto a plain <canvas>
  // (no external libraries needed), turns that into a PNG, and hands it to
  // the OS share sheet (WhatsApp, SMS, etc.) via the Web Share API. Falls
  // back to just downloading the PNG on browsers/devices that can't share
  // files (e.g. desktop Chrome, iOS Safari without file share support).
  // =====================================================================
  function billToCanvas(bill){
    var scale = 2; // render at 2x for a crisp image
    var w = 380;
    var pad = 18;
    var lineH = 20;
    var items = bill.items || [];
    // Rough height estimate: header block + one line per item + totals block + footer
    var lines = 8 + items.length + 8 +
      (bill.payment==='account' ? 1 : 0) +
      (bill.customerName ? 1 : 0) + (bill.customerPhone ? 1 : 0) + (bill.customerAddress ? 1 : 0);
    var h = pad*2 + lines*lineH + 30;
    var canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#111111';
    ctx.textBaseline = 'top';
    var y = pad;
    function center(text, size, bold){
      ctx.font = (bold?'700 ':'')+size+'px monospace';
      var tw = ctx.measureText(text).width;
      ctx.fillText(text, (w-tw)/2, y);
      y += lineH;
    }
    function row(left, right, bold){
      ctx.font = (bold?'700 ':'')+'12px monospace';
      ctx.fillText(left, pad, y);
      var rw = ctx.measureText(right).width;
      ctx.fillText(right, w-pad-rw, y);
      y += lineH;
    }
    function hr(){
      ctx.strokeStyle = '#999999';
      ctx.setLineDash([2,2]);
      ctx.beginPath(); ctx.moveTo(pad, y+6); ctx.lineTo(w-pad, y+6); ctx.stroke();
      ctx.setLineDash([]);
      y += 14;
    }
    center(state.shop.name, 15, true);
    if(state.shop.address) center(state.shop.address, 11, false);
    if(state.shop.phone) center(state.shop.phone, 11, false);
    hr();
    row('Bill No', bill.no);
    row('Date', new Date(bill.dateISO).toLocaleString());
    hr();
    items.forEach(function(it){
      row(it.name+' x'+it.qty, money(it.price*it.qty));
    });
    hr();
    row('Subtotal', money(bill.subtotal));
    row('Discount', '-'+money(bill.discount));
    row('TOTAL', money(bill.total), true);
    row('Payment', bill.payment.toUpperCase()+(bill.chequeNo?' #'+bill.chequeNo:''));
    if(bill.payment==='account') row('Balance Due', money(billBalance(bill)), true);
    if(bill.customerName) row('Customer', bill.customerName);
    if(bill.customerPhone) row('Phone', bill.customerPhone);
    if(bill.customerAddress) row('Address', bill.customerAddress);
    hr();
    if(state.shop.footer) center(state.shop.footer, 11, false);
    return canvas;
  }

  async function shareBillImage(bill){
    if(!bill) return;
    var canvas;
    try{ canvas = billToCanvas(bill); }
    catch(e){ alert('Could not create the bill image: '+(e.message||e)); return; }
    canvas.toBlob(async function(blob){
      if(!blob){ alert('Could not create the bill image.'); return; }
      var fileName = 'bill-'+bill.no+'.png';
      var file = null;
      try{ file = new File([blob], fileName, {type:'image/png'}); }catch(e){ /* File ctor unsupported */ }
      if(file && navigator.canShare && navigator.canShare({files:[file]})){
        try{
          await navigator.share({files:[file], title:'Bill '+bill.no, text: state.shop.name+' — Bill '+bill.no});
          return;
        }catch(e){
          if(e && e.name==='AbortError') return; // user cancelled the share sheet
          // fall through to download
        }
      }
      // Fallback: just download the PNG so it can be shared manually.
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
    }, 'image/png');
  }

  // CUSTOMER STATEMENT (full history) — PRINT + PHOTO SHARE
  // Same idea as a single bill, but summarizes every bill for one
  // customer: each bill's date/total/balance, then grand totals.
  // =====================================================================
  async function buildStatementBytes(customer){
    var width = state.shop.width==='58' ? 32 : 42;
    var out = [];
    function push(){ for(var i=0;i<arguments.length;i++) out.push(arguments[i]); }
    function line(str){ push.apply(null, textToBytes(str)); push(0x0A); }
    function center(on){ push(ESC,0x61,on?1:0); }
    function bold(on){ push(ESC,0x45,on?1:0); }
    function bigSize(on){ push(GS,0x21, on?0x11:0x00); }

    var bills = customer.bills.slice().sort(function(a,b){ return new Date(a.dateISO)-new Date(b.dateISO); });
    var totalPaid = bills.reduce(function(s,b){ return s+billPaidTotal(b); },0);

    push(ESC,0x40);
    center(true);
    bold(true); bigSize(true);
    line(state.shop.name);
    bigSize(false); bold(false);
    if(state.shop.address) wrapText(state.shop.address, width).forEach(line);
    if(state.shop.phone) line(state.shop.phone);
    center(false);
    line(new Array(width+1).join('-'));
    bold(true); line('CUSTOMER STATEMENT'); bold(false);
    wrapText('Customer: '+customer.name, width).forEach(line);
    if(customer.phone) line(padLine('Phone', customer.phone, width));
    if(customer.address) wrapText('Address: '+customer.address, width).forEach(line);
    line(padLine('Printed', new Date().toLocaleString(), width));
    line(new Array(width+1).join('-'));
    bills.forEach(function(b){
      wrapText(b.no+' — '+new Date(b.dateISO).toLocaleDateString(), width).forEach(line);
      line(padLine('  '+b.payment.toUpperCase(), money(b.total), width));
      var bal = billBalance(b);
      if(bal>0.004) line(padLine('  Balance due', money(bal), width));
    });
    line(new Array(width+1).join('-'));
    line(padLine('Total spent', money(customer.totalSpent), width));
    line(padLine('Total paid', money(totalPaid), width));
    bold(true);
    line(padLine('TOTAL BALANCE DUE', money(customer.totalBalance), width));
    bold(false);
    line(new Array(width+1).join('-'));
    center(true);
    if(state.shop.footer) wrapText(state.shop.footer, width).forEach(line);
    push(0x0A,0x0A,0x0A);
    push(GS,0x56,0x42,0x00);
    return new Uint8Array(out);
  }

  // Shared data-gathering for the Day-End / Cash Handover report — used by
  // both the thermal-printer byte builder and the shareable canvas image,
  // so the two outputs never drift out of sync with each other.
  function dayEndReportData(date){
    date = date || todayISO();
    var dateLabel = new Date(date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', year:'numeric', month:'short', day:'numeric'});
    var summary = selectedDateSummary(date);
    var chequeBills = state.bills.filter(function(b){ return b.payment==='cheque' && localDay(b.dateISO)===date; });
    var acctMap = {};
    state.bills.filter(function(b){ return b.payment==='account' && localDay(b.dateISO)===date; }).forEach(function(b){
      var key = b.customerName || '(no name given)';
      if(!acctMap[key]) acctMap[key] = {name:key, bills:0, credit:0, received:0, total:0};
      acctMap[key].bills += 1;
      acctMap[key].credit += (b.total||0);
      acctMap[key].received += billPaidTotal(b);
      acctMap[key].total += billBalance(b);
    });
    var acctRows = Object.keys(acctMap).map(function(k){ return acctMap[k]; }).sort(function(a,b){ return b.total-a.total; });
    var stockRows = stockOpenCloseByDate(date);
    return { date:date, dateLabel:dateLabel, summary:summary, chequeBills:chequeBills, acctRows:acctRows, stockRows:stockRows };
  }

    function bold(on){ push(ESC,0x45,on?1:0); }
    function bigSize(on){ push(GS,0x21, on?0x11:0x00); }
    function hr(){ line(new Array(width+1).join('-')); }

    push(ESC,0x40); // initialize printer

    return new Uint8Array(out);
  }

  async function printDayEndToBluetooth(date){
    if(!state.printer.connected){
      // This call is itself a click/user-gesture, so — same as the topbar
      // "reconnect" pill — try a silent reattach first, and if that doesn't
      // land, fall straight through to the full Connect flow (which needs
      // a user gesture to open the Bluetooth device chooser) instead of
      // just printing an easy-to-miss status message nobody sees.
      var ok = false;
      if(state.printer.device){
        ok = await attemptAutoReconnect(state.printer.device, 2);
      }
      if(!ok && !state.printer.connected){
        await connectPrinter();
      }
      if(!state.printer.connected){
        render(); // connectPrinter()/attemptAutoReconnect already set an explanatory status
        return false;
      }
    }
    try{
      state.printer.status = 'Printing…';
      render();
      var bytes = await buildDayEndBytes(date);
      await writeToPrinter(bytes);
      state.printer.status = 'Printed to '+state.printer.name+'.';
      render();
      return true;
    }catch(e){
      state.printer.status = 'Print failed: '+(e.message||e)+'. Try reconnecting the printer.';
      render();
      return false;
    }
  }

  // Shareable image version of the Day-End / Cash Handover report — for
  // shops without a connected thermal printer, or to send the report over
  // WhatsApp/etc instead of (or as well as) printing it. Mirrors
  // statementToCanvas/shareStatementImage's two-pass "ops list, then draw"
  // approach, but the line count here isn't fixed (cheque/credit/stock
  // sections vary in length), so ops are recorded first and the canvas is
  // sized to fit them before anything is actually drawn.
  function dayEndToCanvas(date){
    var data = dayEndReportData(date);
    var scale = 2, w = 380, pad = 18, lineH = 20;
    var ops = [];
    function center(text, size, bold){ ops.push({t:'center', text:text, size:size, bold:bold}); }
    function row(left, right, bold){ ops.push({t:'row', left:left, right:right||'', bold:bold}); }
    function hr(){ ops.push({t:'hr'}); }

    center(state.shop.name, 15, true);
    if(state.shop.address) center(state.shop.address, 11, false);
    if(state.shop.phone) center(state.shop.phone, 11, false);
    hr();
    center('DAY-END / CASH HANDOVER', 13, true);
    row('Date', data.dateLabel);
    row('Printed', new Date().toLocaleString());
    hr();

    center('CASH SALES', 12, true);
    row('Cash bills', money(data.summary.cashBillAmt));
    row('Received now (Account)', money(data.summary.acctPaidNow));
    row('Received (old balance)', money(data.summary.acctReceivePaymentCash));
    row('Total Cash Sales', money(data.summary.cashSales), true);
    hr();

    center('CHEQUE SALES', 12, true);
    if(data.chequeBills.length){
      data.chequeBills.forEach(function(b){
        row(b.no+' - '+(b.customerName||'—'), '');
        row('  Cheque #'+(b.chequeNo||'—'), money(b.total));
      });
    } else row('No cheque sales.', '');
    if(data.summary.acctReceivePaymentCheque>0.004){
      row('Received (old balance)', money(data.summary.acctReceivePaymentCheque));
    }
    row('Total Cheque Sales', money(data.summary.chequeSales), true);
    hr();

    center('CREDIT SALES', 12, true);
    if(data.acctRows.length){
      data.acctRows.forEach(function(a){
        row(a.name, '');
        row('  Bills '+a.bills+', Recv '+money(a.received), money(a.total));
      });
    } else row('No credit sales.', '');
    row('Total Credit Sales', money(data.summary.creditSales), true);
    hr();

    row('TOTAL SALES', money(data.summary.cashSales+data.summary.chequeSales+data.summary.creditSales), true);
    hr();

    center('OPENING & CLOSING STOCK', 12, true);
    if(data.stockRows.length){
      data.stockRows.forEach(function(r){
        row(r.name, '');
        row('  Open '+r.opening+'  In +'+r.inQty+'  Out -'+r.outQty, 'Close '+r.closing);
      });
    } else row('No items.', '');
    hr();
    if(state.shop.footer) center(state.shop.footer, 11, false);

    var lineCount = ops.filter(function(o){ return o.t!=='hr'; }).length;
    var hrCount = ops.filter(function(o){ return o.t==='hr'; }).length;
    var h = pad*2 + lineCount*lineH + hrCount*14 + 20;

    var canvas = document.createElement('canvas');
    canvas.width = w*scale; canvas.height = h*scale;
    var ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0,0,w,h);
    ctx.fillStyle = '#111111';
    ctx.textBaseline = 'top';
    var y = pad;
    ops.forEach(function(o){
      if(o.t==='center'){
        ctx.font = (o.bold?'700 ':'')+o.size+'px monospace';
        var tw = ctx.measureText(o.text).width;
        ctx.fillText(o.text, (w-tw)/2, y);
        y += lineH;
      } else if(o.t==='row'){
        ctx.font = (o.bold?'700 ':'')+'12px monospace';
        ctx.fillText(o.left, pad, y);
        var rw = ctx.measureText(o.right).width;
        ctx.fillText(o.right, w-pad-rw, y);
        y += lineH;
      } else if(o.t==='hr'){
        ctx.strokeStyle = '#999999';
        ctx.setLineDash([2,2]);
        ctx.beginPath(); ctx.moveTo(pad, y+6); ctx.lineTo(w-pad, y+6); ctx.stroke();
        ctx.setLineDash([]);
        y += 14;
      }
    });
    return canvas;
  }

  async function sheetGet(key, isRetry){
    if(!sheetConfigured()) return null;
    try{
      var res = await fetch(CONFIG.SHEET_API_URL+'?action=get&key='+encodeURIComponent(key));
      if(!res.ok) throw new Error('HTTP '+res.status);
      var data = await res.json();
      state.storageOk = true;
      return data.value ? JSON.parse(data.value) : null;
    }catch(e){
      if(!isRetry){
        // Apps Script cold-starts and dropped mobile connections both look
        // like a one-off failure here — give it a single retry after a
        // short pause before treating it as a real failure.
        await new Promise(function(r){ setTimeout(r, 900); });
        return sheetGet(key, true);
      }
      state.storageOk = false;
      // Throw rather than return null. null must only ever mean "the sheet
      // was reached and this key truly has no data" — the one case boot()
      // may safely treat as a first run. Swallowing a failed request into
      // that same null is what let a dropped connection get mistaken for a
      // brand-new shop and overwrite real items/users with demo data.
      throw e;
    }
  }
  async function sheetSet(key, val, isRetry){
    if(!sheetConfigured()) return false;
    try{
      var res = await fetch(CONFIG.SHEET_API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight, Apps Script can't handle OPTIONS
        body: JSON.stringify({ key:key, value: JSON.stringify(val) })
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      // Apps Script returns a JSON body on success; if it can't be parsed
      // (e.g. an HTML error/login page came back instead), treat it as a
      // failure rather than silently reporting success.
      var text = await res.text();
      try{
        var data = JSON.parse(text);
        if(data && data.error) throw new Error(data.error);
      }catch(parseErr){
        if(parseErr instanceof SyntaxError) throw new Error('Unexpected response from Sheet API (not JSON) — check the Apps Script deployment/authorization.');
        throw parseErr;
      }
      state.storageOk = true;
      return true;
    }catch(e){
      if(!isRetry){
        // A lock timeout ("Sheet is busy") is usually a one-off — the lock
        // that was held when we asked has almost always been released a
        // second later. Give it one silent retry before bothering the
        // user with the "Not saved" banner, same pattern storageGet uses.
        await new Promise(function(r){ setTimeout(r, 1200); });
        return sheetSet(key, val, true);
      }
      state.storageOk=false;
      state.storageErr = (e && e.message) || 'Save failed';
      return false;
    }
  }

  // ---------------- SUPABASE STORAGE (primary) ----------------
  function supaHeaders(extra){
    var h = { 'apikey': CONFIG.SUPABASE_ANON_KEY, 'Authorization': 'Bearer '+CONFIG.SUPABASE_ANON_KEY };
    if(extra) Object.keys(extra).forEach(function(k){ h[k]=extra[k]; });
    return h;
  }
  function supaUrl(){ return CONFIG.SUPABASE_URL.replace(/\/+$/,'')+'/rest/v1/'+CONFIG.SUPABASE_TABLE; }

  // Returns the parsed value, or null ONLY when Supabase was reached and the
  // key truly has no row. Any failed request throws (same safety rule as before:
  // a dropped connection must never look like a brand-new empty shop).
  async function supaGet(key, isRetry){
    try{
      var res = await fetch(supaUrl()+'?key=eq.'+encodeURIComponent(key)+'&select=value', { headers: supaHeaders() });
      if(!res.ok) throw new Error('Supabase HTTP '+res.status);
      var rows = await res.json();
      state.storageOk = true;
      if(rows && rows.length && rows[0].value) return JSON.parse(rows[0].value);
      return null;
    }catch(e){
      if(!isRetry){
        await new Promise(function(r){ setTimeout(r, 700); });
        return supaGet(key, true);
      }
      state.storageOk = false;
      throw e;
    }
  }
  async function supaSet(key, val, isRetry){
    try{
      var res = await fetch(supaUrl()+'?on_conflict=key', {
        method:'POST',
        headers: supaHeaders({ 'Content-Type':'application/json', 'Prefer':'resolution=merge-duplicates,return=minimal' }),
        body: JSON.stringify({ key:key, value: JSON.stringify(val), updated_at: new Date().toISOString() })
      });
      if(!res.ok){
        var t=''; try{ t = await res.text(); }catch(_){}
        throw new Error('Supabase HTTP '+res.status+(t?(' — '+t.slice(0,160)):''));
      }
      state.storageOk = true;
      return true;
    }catch(e){
      if(!isRetry){
        await new Promise(function(r){ setTimeout(r, 900); });
        return supaSet(key, val, true);
      }
      state.storageOk = false;
      state.storageErr = (e && e.message) || 'Save failed';
      return false;
    }
  }

  // ---------------- STORAGE FACADE (what the rest of the app calls) ----------------
  async function storageGet(key){
    if(!supabaseConfigured()) return sheetGet(key);   // not set up yet -> old Sheet behaviour
    var v = await supaGet(key);
    if(v !== null) return v;
    // No row in Supabase: one-time copy from the old Google Sheet.
    if(CONFIG.MIGRATE_FROM_SHEET && sheetConfigured()){
      var old = await sheetGet(key);        // throws if the Sheet can't be reached
      if(old !== null && old !== undefined){
        await supaSet(key, old);            // best effort; next boot will find it
        return old;
      }
    }
    return null;
  }
  async function storageSet(key, val){
    if(!supabaseConfigured()) return sheetSet(key, val);
    return supaSet(key, val);
  }

  // ---------------- LOCAL FAST-LOAD CACHE ----------------
  // A localStorage mirror of the last known-good Sheet data. This is
  // purely a speed layer — the Google Sheet stays the single source of
  // truth and every save still goes there exactly as before. The cache
  // only lets boot() paint real data immediately instead of showing a
  // spinner for however long the Apps Script round-trip takes, and it is
  // refreshed every time a Sheet read or write succeeds so it stays in
  // sync with the real data rather than going stale.
  function loadLocalCache(){
    try{
      var raw = localStorage.getItem(LOCAL_CACHE_KEY);
      return raw ? JSON.parse(raw) : null;
    }catch(e){ return null; }
  }
  function saveLocalCache(){
    try{
      localStorage.setItem(LOCAL_CACHE_KEY, JSON.stringify({
        items: state.items,
        users: state.users,

        returns: state.returns,
        deletedBills: state.deletedBills,
        printers: state.printerHistory,
        ts: Date.now()
      }));
    }catch(e){}
  }

  // Applies the customizable app title (default 'BILL APP') to the
  // browser tab title and the iOS/PWA home-screen title meta tag,

  function applyAppTitle(){
