            '<div style="font-weight:800;font-size:15px;color:var(--ink);">'+escapeHtml(c.name)+'</div>'+
            (c.phone ? '<div style="font-size:12px;color:var(--text-dim);">&#128222; '+escapeHtml(c.phone)+'</div>' : '')+
            '<div style="font-size:12px;color:var(--text-dim);">'+c.bills.length+' pending bill'+(c.bills.length>1?'s':'')+'</div>'+
          '</div>'+
          '<div style="text-align:right;">'+
            '<div style="font-size:12px;color:var(--text-dim);">Total Owed</div>'+
            '<div style="font-size:20px;font-weight:800;color:var(--red);">'+money(c.totalOwed)+'</div>'+
          '</div>'+
        '</div>'+
        '<div class="acct-row-actions" style="margin-top:8px;">'+
          '<button class="btn btn-ghost btn-sm" data-toggle-pending-cust="'+custKey+'">'+(isOpen?'&#9650; Hide bills':'&#9660; View bills ('+c.bills.length+')')+'</button>'+
          (c.phone ? '<a class="btn btn-amber btn-sm" href="tel:'+escapeHtml(c.phone)+'" style="text-decoration:none;display:inline-flex;align-items:center;">&#128222; Call</a>' : '')+
          (printingEnabled() ? '<button class="btn btn-ghost btn-sm" data-print-statement="'+c.name.toLowerCase()+'">Print Statement</button>' : '')+
          '<button class="btn btn-ghost btn-sm" data-view-statement="'+c.name.toLowerCase()+'">View Statement</button>'+
          '<button class="btn btn-ghost btn-sm" data-share-statement="'+c.name.toLowerCase()+'">Share Statement</button>'+
        '</div>'+
        (isOpen ?
          '<div style="margin-top:10px;overflow-x:auto;">'+
            '<table><thead><tr>'+
              '<th>Bill #</th><th>Date</th><th>Bill Total</th><th>Paid</th><th>Balance Due</th><th>Actions</th>'+
            '</tr></thead><tbody>'+billRowsHtml+'</tbody></table>'+
          '</div>'
        : '')+
      '</div>';
    }).join('');

    return '<div class="card" style="margin-bottom:18px;border:1.5px solid var(--red);background:linear-gradient(180deg,rgba(220,61,61,.06),rgba(220,61,61,0) 40%);box-shadow:0 2px 10px rgba(220,61,61,.12);">'+
      '<div class="section-head">'+
        '<h3 style="font-size:17px;font-weight:800;color:var(--red);">&#9888; Pending Credit Bills &mdash; All Outstanding</h3>'+
      '</div>'+
      '<div style="display:flex;gap:14px;flex-wrap:wrap;margin-bottom:14px;">'+
        '<div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 16px;flex:1;min-width:120px;text-align:center;">'+
          '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">Pending Bills</div>'+
          '<div style="font-size:22px;font-weight:800;color:var(--ink);">'+totalPendingBillCount+'</div>'+
        '</div>'+
        '<div style="background:var(--white);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 16px;flex:1;min-width:120px;text-align:center;">'+
          '<div style="font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;">Customers with Balance</div>'+
          '<div style="font-size:22px;font-weight:800;color:var(--ink);">'+custList.length+'</div>'+
        '</div>'+
        '<div style="background:rgba(220,61,61,.08);border:1.5px solid var(--red);border-radius:var(--radius-sm);padding:10px 16px;flex:2;min-width:160px;text-align:center;">'+
          '<div style="font-size:11px;color:var(--red);text-transform:uppercase;letter-spacing:.05em;margin-bottom:2px;font-weight:700;">Total Outstanding</div>'+
          '<div style="font-size:26px;font-weight:800;color:var(--red);">'+money(totalPending)+'</div>'+
        '</div>'+
      '</div>'+
      custRowsHtml+
    '</div>';
  }

  function renderReports(){
    var mrMode = state.monthlyRepMode || 'month';
    var mrMonthVal = state.monthlyRepMonth || todayISO().slice(0,7);
    var selDate = state.reportSelectedDate || todayISO();
    var selSummary = selectedDateSummary(selDate);
    var selDateLabel = new Date(selDate+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', year:'numeric', month:'short', day:'numeric'});

    var todays = billsInRange('today');
    var monthly = billsInRange('month');
    var all = state.bills;
    var todaysTotal = todays.reduce(function(s,b){ return s+b.total; },0);
    var monthlyTotal = monthly.reduce(function(s,b){ return s+b.total; },0);

    var filtered = filteredReportBills();
    var fCashTotal = filtered.filter(function(b){return b.payment==='cash';}).reduce(function(s,b){return s+b.total;},0);
    var fChequeTotal = filtered.filter(function(b){return b.payment==='cheque';}).reduce(function(s,b){return s+b.total;},0);
    var fAccountTotal = filtered.filter(function(b){return b.payment==='account';}).reduce(function(s,b){return s+billBalance(b);},0);
    var fCashCount = filtered.filter(function(b){return b.payment==='cash';}).length;
    var fChequeCount = filtered.filter(function(b){return b.payment==='cheque';}).length;
    var fAccountCount = filtered.filter(function(b){return b.payment==='account';}).length;

    var topItems = topItemsSummary(filtered, 5);
    var topItemsHtml = topItems.length ? '<table><thead><tr><th>Item</th><th>Qty sold</th><th>Revenue</th></tr></thead><tbody>'+
      topItems.map(function(t){ return '<tr><td>'+escapeHtml(t.name)+'</td><td class="num">'+t.qty+'</td><td class="num">'+money(t.revenue)+'</td></tr>'; }).join('')+
      '</tbody></table>' : '<div class="empty-note">No sales match this filter.</div>';

    // day-by-day breakdown — scoped to the selected date (still respects the payment-type filter), most recent first
    var byDay = groupBillsByDay(state.bills.filter(function(b){
      return localDay(b.dateISO)===selDate && (state.reportPayment==='all' || b.payment===state.reportPayment);
    }));
    var dayRows = byDay.map(function(d){
      var isOpen = state.expandedDay === d.date;
      var dayLabel = new Date(d.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', year:'numeric', month:'short', day:'numeric'});
      var detailRows = d.bills.slice().reverse().map(function(b){
        return '<tr><td>'+b.no+'</td><td>'+new Date(b.dateISO).toLocaleTimeString()+'</td><td>'+escapeHtml(b.cashier)+'</td>'+
          '<td>'+(b.customerName? escapeHtml(b.customerName) : '<span style="color:var(--text-dim);">—</span>')+(b.customerPhone? '<br><span style="color:var(--text-dim);font-size:11px;">'+escapeHtml(b.customerPhone)+'</span>':'')+'</td>'+
          '<td><span class="pill '+b.payment+'">'+b.payment+'</span>'+(b.chequeNo?' <span style="color:var(--text-dim);font-size:11px;">#'+escapeHtml(b.chequeNo)+'</span>':'')+'</td>'+
          '<td class="num">'+billItemCount(b)+'</td><td class="num">'+money(b.total)+'</td>'+
          '<td>'+billActionButtonsHtml(b)+'</td></tr>';
      }).join('');
      return '<tr class="day-row" data-day="'+d.date+'" style="cursor:pointer;">'+
          '<td>'+(isOpen?'▾ ':'▸ ')+dayLabel+'</td>'+
          '<td class="num">'+d.bills.length+'</td>'+
          '<td class="num">'+d.itemsSold+'</td>'+
          '<td class="num">'+money(d.cash)+'</td>'+
          '<td class="num">'+money(d.cheque)+'</td>'+
          '<td class="num" style="color:var(--red);">'+money(d.credit)+'</td>'+
          '<td class="num" style="font-weight:700;color:var(--green);">'+money(d.total)+'</td>'+
        '</tr>'+
        (isOpen ? '<tr><td colspan="7" style="padding:0;border-bottom:1px solid var(--line);">'+
          '<div style="padding:8px 4px 14px;overflow-x:auto;">'+
            '<table><thead><tr><th>Bill</th><th>Time</th><th>'+escapeHtml(state.shop.repLabel || 'Sales Rep')+'</th><th>Customer</th><th>Payment</th><th>Items</th><th>Total</th><th>Action</th></tr></thead>'+
            '<tbody>'+detailRows+'</tbody></table>'+
          '</div>'+
        '</td></tr>' : '');
    }).join('');

    // Cheque detail — cheque bills on the selected date, plus any Receive
    // Payment collections on account bills that day recorded as Cheque.
    var chequeBills = state.bills.filter(function(b){ return b.payment==='cheque' && localDay(b.dateISO)===selDate; });
    var chequeRecoveries = [];
    state.bills.forEach(function(b){
      if(b.payment!=='account') return;
      (b.payments||[]).forEach(function(p){
        if(p.note==='Payment at time of sale') return;
        if(p.method!=='cheque') return;
        if(localDay(p.dateISO)!==selDate) return;
        chequeRecoveries.push({bill:b, payment:p});
      });
    });
    var chequeDetailHtml = (chequeBills.length || chequeRecoveries.length) ? '<table><thead><tr><th>Bill</th><th>Date</th><th>Cheque No.</th><th>Customer</th><th>Type</th><th>Amount</th></tr></thead><tbody>'+
      chequeBills.slice().reverse().map(function(b){
        return '<tr><td>'+b.no+'</td><td>'+new Date(b.dateISO).toLocaleDateString()+'</td><td>'+escapeHtml(b.chequeNo||'—')+'</td>'+
          '<td>'+(b.customerName?escapeHtml(b.customerName):'—')+'</td><td>Cheque bill</td><td class="num">'+money(b.total)+'</td></tr>';
      }).join('')+
      chequeRecoveries.slice().reverse().map(function(r){
        return '<tr><td>'+r.bill.no+'</td><td>'+new Date(r.payment.dateISO).toLocaleDateString()+'</td><td>—</td>'+
          '<td>'+(r.bill.customerName?escapeHtml(r.bill.customerName):'—')+'</td><td>Receive Payment</td><td class="num">'+money(r.payment.amount)+'</td></tr>';
      }).join('')+'</tbody></table>' : '<div class="empty-note">No cheque payments on '+selDateLabel+'.</div>';

    // Account detail — grouped by customer, on the selected date only (bills raised that day)
    var acctMap = {};
    state.bills.filter(function(b){ return b.payment==='account' && localDay(b.dateISO)===selDate; }).forEach(function(b){
      var key = b.customerName || '(no name given)';
      if(!acctMap[key]) acctMap[key] = {name:key, phone:b.customerPhone||'', bills:0, credit:0, received:0, total:0};
      acctMap[key].bills += 1;
      acctMap[key].credit += (b.total||0);
      acctMap[key].received += billPaidTotal(b);
      acctMap[key].total += billBalance(b);
      if(!acctMap[key].phone && b.customerPhone) acctMap[key].phone = b.customerPhone;
    });
    var acctRows = Object.keys(acctMap).map(function(k){ return acctMap[k]; }).sort(function(a,b){ return b.total-a.total; });
    var accountDetailHtml = acctRows.length ? '<table><thead><tr><th>Customer</th><th>Phone</th><th>Bills</th><th>Total Credit Amount</th><th>Amount received now</th><th>Balance owed</th></tr></thead><tbody>'+
      acctRows.map(function(a){
        return '<tr><td>'+escapeHtml(a.name)+'</td><td>'+(a.phone?escapeHtml(a.phone):'—')+'</td><td class="num">'+a.bills+'</td>'+
          '<td class="num">'+money(a.credit)+'</td>'+
          '<td class="num" style="color:var(--green);">'+money(a.received)+'</td>'+
          '<td class="num" style="font-weight:700;color:var(--red);">'+money(a.total)+'</td></tr>';
      }).join('')+'</tbody></table>' : '<div class="empty-note">No account (credit) sales on '+selDateLabel+'.</div>';

    var cashDays = dailyCashSummary().filter(function(r){ return r.date===selDate; });
    var cashDaysHtml = cashDays.length ? '<table><thead><tr><th>Day</th><th>Cash sales</th><th>Cheque sales</th><th>Credit given</th><th>Payments received</th><th>Cash on hand</th></tr></thead><tbody>'+
      cashDays.map(function(r){
        var lbl = new Date(r.date+'T00:00:00').toLocaleDateString(undefined,{weekday:'short', month:'short', day:'numeric'});
        return '<tr><td>'+lbl+'</td><td class="num">'+money(r.cash)+'</td><td class="num">'+money(r.cheque)+'</td>'+
          '<td class="num" style="color:var(--red);">'+money(r.credit)+'</td>'+
          '<td class="num" style="color:var(--green);">'+money(r.received)+'</td>'+
          '<td class="num" style="font-weight:800;">'+money(r.cashOnHand)+'</td></tr>';
      }).join('')+'</tbody></table>' : '<div class="empty-note">No bills in this range.</div>';

    var today = todayISO();
    // Payments collected today against account (credit) balances — added
    // into "Cash sales amount (Today)" below, same as "Cash on hand" in
    // the daily breakdown table, split by how each payment was recorded.
    var totalReceivedToday = state.bills.reduce(function(s,b){
      if(b.payment!=='account') return s; // only credit-sale collections; cash/cheque bills' own payments[] entry is the sale itself, not a separate collection
      return s + (b.payments||[]).reduce(function(s2,p){
        if(localDay(p.dateISO)!==today) return s2;
        if(p.note!=='Payment at time of sale' && p.method==='cheque') return s2;
        return s2+(p.amount||0);
      },0);
    },0);
    var totalReceivedChequeToday = state.bills.reduce(function(s,b){
      if(b.payment!=='account') return s;
      return s + (b.payments||[]).reduce(function(s2,p){
        if(localDay(p.dateISO)!==today) return s2;
        if(p.note!=='Payment at time of sale' && p.method==='cheque') return s2+(p.amount||0);
        return s2;
      },0);
    },0);
    var totalCashSalesToday = state.bills.reduce(function(s,b){
      return (b.payment==='cash' && localDay(b.dateISO)===today) ? s+b.total : s;
    },0) + totalReceivedToday;
    var totalChequeToday = state.bills.reduce(function(s,b){
      return (b.payment==='cheque' && localDay(b.dateISO)===today) ? s+b.total : s;
    },0) + totalReceivedChequeToday;
    var totalCreditToday = state.bills.reduce(function(s,b){
      return (b.payment==='account' && localDay(b.dateISO)===today) ? s+b.total : s;
    },0);

    var rangeLabel = (state.reportFrom||state.reportTo) ?
      (escapeHtml(state.reportFrom||'…')+' &rarr; '+escapeHtml(state.reportTo||'…')) : 'All time';


    return ''+
    '<h1 class="page-title">Reports</h1><p class="page-sub">Search by date, and drill into cash, cheque, and account sales.</p>'+
    pageActionsHtml()+

    '<div class="card" style="margin-bottom:14px;">'+
      '<div class="date-select-bar">'+
        '<div class="field"><label>Select date</label><input type="date" id="rep-sel-date" value="'+escapeHtml(selDate)+'"></div>'+
        '<button class="btn btn-primary btn-sm" id="rep-sel-date-today">Today</button>'+
        (printingEnabled() ? '<button class="btn btn-amber btn-sm" id="rep-print-dayend" type="button">&#128424; Print Day-End / Handover</button>' : '')+
        '<button class="btn btn-ghost btn-sm" id="rep-share-dayend" type="button">Share Day-End as photo</button>'+
      '</div>'+
      (printingEnabled() ? '<div class="note-box" style="margin-top:10px;">Prints one long thermal slip for '+selDateLabel+': cash sales, cheque sales, credit sales, and opening/closing stock for every item.</div>' : '')+
      (state.printer.status ? '<div class="printer-status" style="margin-top:10px;"><span class="dot '+(state.printer.connected?'ok':'off')+'"></span><span>'+escapeHtml(state.printer.status)+'</span></div>' : '')+
    '</div>'+

    '<div class="banner-grid">'+
      '<div class="banner-card banner-cash"><span class="b-icon">&#128181;</span>'+
        '<div class="b-label">Cash Sales &middot; '+selDateLabel+'</div>'+
        '<div class="b-val">'+money(selSummary.cashSales)+'</div>'+
        '<div class="b-sub">'+
          '<div><span>Cash bills</span><span>'+money(selSummary.cashBillAmt)+'</span></div>'+
          '<div><span>Amount received now (Account)</span><span>'+money(selSummary.acctPaidNow)+'</span></div>'+
          '<div><span>Receive Payment (old bill balance)</span><span>'+money(selSummary.acctReceivePaymentCash)+'</span></div>'+
        '</div>'+
      '</div>'+
      '<div class="banner-card banner-cheque"><span class="b-icon">&#128179;</span>'+
        '<div class="b-label">Cheque Sales &middot; '+selDateLabel+'</div>'+
        '<div class="b-val">'+money(selSummary.chequeSales)+'</div>'+
        '<div class="b-sub">'+
          '<div><span>Cheque bills, '+selDateLabel+'</span><span>'+money(selSummary.chequeSales-selSummary.acctReceivePaymentCheque)+'</span></div>'+
          (selSummary.acctReceivePaymentCheque>0.004 ? '<div><span>Receive Payment (old bill balance)</span><span>'+money(selSummary.acctReceivePaymentCheque)+'</span></div>' : '')+
        '</div>'+
      '</div>'+
      '<div class="banner-card banner-credit"><span class="b-icon">&#128100;</span>'+
        '<div class="b-label">Credit Sales &middot; '+selDateLabel+'</div>'+
        '<div class="b-val">'+money(selSummary.creditSales)+'</div>'+
        '<div class="b-sub"><div><span>Balance due, bills raised '+selDateLabel+'</span><span>'+money(selSummary.creditSales)+'</span></div></div>'+
      '</div>'+
    '</div>'+

    '<div class="card cash-highlight" style="margin-bottom:18px;">'+
      '<div class="section-head"><h3>&#128176; Cash on Hand &mdash; Daily Summary ('+selDateLabel+')</h3>'+
        '<button class="btn btn-ghost btn-sm" id="cash-summary-toggle" type="button">'+(state.cashSummaryCollapsed?'Show &#9662;':'Hide &#9652;')+'</button>'+
      '</div>'+
      (state.cashSummaryCollapsed ? '' :
        '<div class="note-box">Cash on hand = cash sales + payments received against account balances, per day. Only payments recorded as Cash count here — cheque payments are counted under Cheque sales instead. See the Bills page to record those payments.</div>'+
        cashDaysHtml
      )+
    '</div>'+

    '<div class="card highlight-amber" style="margin-bottom:18px;"><div class="section-head"><h3>&#128202; Sales by day ('+selDateLabel+')'+(state.reportPayment!=='all'?' &middot; '+state.reportPayment:'')+'</h3></div>'+
      (dayRows ? '<table><thead><tr><th>Day</th><th>Bills</th><th>Items</th><th>Cash</th><th>Cheque</th><th>Credit</th><th>Total</th></tr></thead><tbody>'+dayRows+'</tbody></table>' : '<div class="empty-note">No bills on '+selDateLabel+'.</div>')+
    '</div>'+

    '<div class="card highlight-ink" style="margin-bottom:18px;"><div class="section-head"><h3>&#128179; Cheque payments &mdash; detail ('+selDateLabel+')</h3></div>'+chequeDetailHtml+'</div>'+
    '<div class="card highlight-red" style="margin-bottom:18px;"><div class="section-head"><h3>&#128100; Account (credit) sales &mdash; by customer ('+selDateLabel+')</h3></div>'+accountDetailHtml+'</div>'+

    pendingCreditBillsCardHtml()+

    '<div class="card" style="margin-bottom:18px;">'+
      '<div class="section-head"><h3>&#128196; Sales Report &mdash; PDF</h3></div>'+
      '<div class="note-box">A shareable PDF statement with total cash, cheque and credit sales, customer balances due, and full sales details for the period.</div>'+
      '<div class="form-row" style="margin-top:10px;">'+
        '<div class="field"><label>Report for</label><select id="mrep-mode">'+
          '<option value="month" '+(mrMode==='month'?'selected':'')+'>Whole month</option>'+
          '<option value="range" '+(mrMode==='range'?'selected':'')+'>Date to date</option>'+
        '</select></div>'+
        '<div class="field" id="mrep-month-field" style="'+(mrMode==='range'?'display:none;':'')+'"><label>Month</label><input type="month" id="mrep-month" value="'+escapeHtml(mrMonthVal)+'"></div>'+
        '<div class="field" id="mrep-from-field" style="'+(mrMode==='month'?'display:none;':'')+'"><label>From</label><input type="date" id="mrep-from" value="'+escapeHtml(state.monthlyRepFrom||'')+'"></div>'+
        '<div class="field" id="mrep-to-field" style="'+(mrMode==='month'?'display:none;':'')+'"><label>To</label><input type="date" id="mrep-to" value="'+escapeHtml(state.monthlyRepTo||'')+'"></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="btn btn-primary btn-sm" id="mrep-share">Share Report as PDF</button>'+
        '<button class="btn btn-ghost btn-sm" id="mrep-download">Download PDF</button>'+
      '</div>'+
    '</div>'+

    '<div class="card" style="margin-bottom:18px;">'+
      '<div class="section-head"><h3>Search</h3></div>'+
      '<div class="form-row">'+
        '<div class="field"><label>From</label><input type="date" id="rep-from" value="'+escapeHtml(state.reportFrom)+'"></div>'+
        '<div class="field"><label>To</label><input type="date" id="rep-to" value="'+escapeHtml(state.reportTo)+'"></div>'+
        '<div class="field"><label>Payment type</label><select id="rep-payment">'+
          ['all','cash','cheque','account'].map(function(p){ return '<option value="'+p+'" '+(state.reportPayment===p?'selected':'')+'>'+(p==='all'?'All payments':p.charAt(0).toUpperCase()+p.slice(1))+'</option>'; }).join('')+
        '</select></div>'+
      '</div>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap;">'+
        '<button class="btn btn-primary btn-sm" id="rep-search">Search</button>'+
        '<button class="btn btn-ghost btn-sm" data-preset="today">Today</button>'+
        '<button class="btn btn-ghost btn-sm" data-preset="week">Last 7 days</button>'+
        '<button class="btn btn-ghost btn-sm" data-preset="month">This month</button>'+
        '<button class="btn btn-ghost btn-sm" data-preset="all">All time</button>'+
      '</div>'+
    '</div>'+

    '<div class="stat-grid">'+
      '<div class="stat-card accent"><div class="lbl">Today\'s Sales</div><div class="val">'+money(todaysTotal)+'</div></div>'+
      '<div class="stat-card accent"><div class="lbl">This Month</div><div class="val">'+money(monthlyTotal)+'</div></div>'+
      '<div class="stat-card"><div class="lbl">Cash ('+rangeLabel+')</div><div class="val">'+money(fCashTotal)+'</div></div>'+
      '<div class="stat-card"><div class="lbl">Cheque ('+rangeLabel+')</div><div class="val">'+money(fChequeTotal)+'</div></div>'+
      '<div class="stat-card"><div class="lbl">On Account ('+rangeLabel+')</div><div class="val">'+money(fAccountTotal)+'</div></div>'+
    '</div>';
  }

  function bindReportsEvents(){
    var cashSummaryToggle = document.getElementById('cash-summary-toggle');
    if(cashSummaryToggle) cashSummaryToggle.addEventListener('click', function(){
      state.cashSummaryCollapsed = !state.cashSummaryCollapsed;
      render();
    });
    var repSelDate = document.getElementById('rep-sel-date');
    if(repSelDate) repSelDate.addEventListener('change', function(e){
      state.reportSelectedDate = e.target.value || todayISO();
      render();
    });
    var repSelDateToday = document.getElementById('rep-sel-date-today');
    if(repSelDateToday) repSelDateToday.addEventListener('click', function(){
      state.reportSelectedDate = todayISO();
      render();
    });
    var repPrintDayEnd = document.getElementById('rep-print-dayend');
    if(repPrintDayEnd) repPrintDayEnd.addEventListener('click', function(){
      printDayEndToBluetooth(state.reportSelectedDate || todayISO());

  // ---------------- MONTHLY / RANGE SALES REPORT (PDF) ----------------
  // Resolves the report period from the form: either the whole selected
  // calendar month, or a custom From/To date range.
  function monthlyReportRange(){
    if(state.monthlyRepMode==='range'){
      var f = state.monthlyRepFrom||'', t = state.monthlyRepTo||'';
      var label = (f||'…')+' to '+(t||'…');
      return {from:f, to:t, label:label};
    }
    var m = state.monthlyRepMonth || todayISO().slice(0,7); // 'YYYY-MM'
    var y = parseInt(m.slice(0,4),10), mo = parseInt(m.slice(5,7),10);
    var lastDay = new Date(y, mo, 0).getDate();
    var from = m+'-01', to = m+'-'+String(lastDay).padStart(2,'0');
    var label = (isNaN(y)||isNaN(mo)) ? m : new Date(y, mo-1, 1).toLocaleDateString(undefined,{month:'long', year:'numeric'});
    return {from:from, to:to, label:label};
  }

  // Same cash/cheque/credit definitions used on the Reports page banners
  // and the "…By Date" mirror tabs, aggregated across a whole date range
  // instead of a single day.
  function reportRangeSummary(from, to){
    var inRange = function(day){ return (!from || day>=from) && (!to || day<=to); };
    var cashBills=[], chequeBills=[], creditBills=[];
    var acctPaidNow=0, acctReceivePaymentCash=0, acctReceivePaymentCheque=0;
    state.bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(inRange(day)){
        if(b.payment==='cash') cashBills.push(b);
        else if(b.payment==='cheque') chequeBills.push(b);
        else if(b.payment==='account') creditBills.push(b);
      }
      if(b.payment==='account'){
        (b.payments||[]).forEach(function(p){
          if(!inRange(localDay(p.dateISO))) return;
          if(p.note==='Payment at time of sale') acctPaidNow += (p.amount||0);
          else if(p.method==='cheque') acctReceivePaymentCheque += (p.amount||0);
          else acctReceivePaymentCash += (p.amount||0);
        });
      }
    });
    var acctReceivePayment = acctReceivePaymentCash + acctReceivePaymentCheque;
    var sortByDate = function(a,b){ return new Date(a.dateISO)-new Date(b.dateISO); };
    cashBills.sort(sortByDate); chequeBills.sort(sortByDate); creditBills.sort(sortByDate);
    var cashBillTotal = cashBills.reduce(function(s,b){return s+b.total;},0);
    var chequeTotal = chequeBills.reduce(function(s,b){return s+b.total;},0) + acctReceivePaymentCheque;
    var creditBillTotal = creditBills.reduce(function(s,b){return s+b.total;},0);
    var creditBalanceDue = creditBills.reduce(function(s,b){return s+billBalance(b);},0);
    var allInRange = state.bills.filter(function(b){ return inRange(localDay(b.dateISO)); });
    return {
      cashBills:cashBills, chequeBills:chequeBills, creditBills:creditBills,
      cashBillTotal:cashBillTotal, acctPaidNow:acctPaidNow, acctReceivePayment:acctReceivePaymentCash,
      acctReceivePaymentCheque:acctReceivePaymentCheque,
      totalCashSales: cashBillTotal+acctPaidNow+acctReceivePaymentCash,
      chequeTotal:chequeTotal, creditBillTotal:creditBillTotal, creditBalanceDue:creditBalanceDue,
      allBills: allInRange,
      totalRevenue: allInRange.reduce(function(s,b){return s+b.total;},0),
      totalDiscount: allInRange.reduce(function(s,b){return s+(b.discount||0);},0),
      totalItemsSold: allInRange.reduce(function(s,b){return s+billItemCount(b);},0)
    };
  }

  // Builds the professional PDF statement. Returns null if the jsPDF
  // library (loaded from CDN) hasn't finished loading yet.
  function buildMonthlyReportPdf(range){
    var ctor = window.jspdf && window.jspdf.jsPDF;
    if(!ctor) return null;
    var doc = new ctor({unit:'mm', format:'a4'});
    var pageW = doc.internal.pageSize.getWidth(), pageH = doc.internal.pageSize.getHeight();
    var marginL = 14, marginR = 14, usableW = pageW-marginL-marginR;
    var INK=[15,61,117], DIM=[92,112,137], LINE=[217,228,245], RED=[192,45,45], GREEN=[22,101,52], TEXT=[30,34,48];
    var y = 18;

    function newPageIfNeeded(need){
      if(y+need > pageH-18){ doc.addPage(); y = 18; }
    }
    function sectionTitle(text){
      newPageIfNeeded(12);
      doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(INK[0],INK[1],INK[2]);
      doc.text(text, marginL, y);
      y += 2;
      doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineWidth(0.4);
      doc.line(marginL, y, pageW-marginR, y);
      y += 6;
    }
    function kvRow(label, value, bold, color){
      newPageIfNeeded(6);
      doc.setFont('helvetica', bold?'bold':'normal'); doc.setFontSize(9);
      var c = color || TEXT;
      doc.setTextColor(c[0],c[1],c[2]);
      doc.text(label, marginL+2, y);
      doc.text(String(value), pageW-marginR-1, y, {align:'right'});
      y += 5.6;
    }
    function table(headers, rows, colWidths, aligns, emptyMsg){
      if(!rows.length){
        newPageIfNeeded(6);
        doc.setFont('helvetica','normal'); doc.setFontSize(8.8); doc.setTextColor(DIM[0],DIM[1],DIM[2]);
        doc.text(emptyMsg||'No records for this period.', marginL+2, y);
        y += 6.5;
        return;
      }
      var lineH = 5.4;
      newPageIfNeeded(lineH+2);
      doc.setFillColor(INK[0],INK[1],INK[2]);
      doc.rect(marginL, y-3.9, usableW, lineH+1.2, 'F');
      doc.setFont('helvetica','bold'); doc.setFontSize(8); doc.setTextColor(255,255,255);
      var x = marginL;
      headers.forEach(function(h,i){
        if(aligns[i]==='right') doc.text(h, x+colWidths[i]-2, y, {align:'right'});
        else doc.text(h, x+2, y);
        x += colWidths[i];
      });
      y += lineH+1.6;
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(TEXT[0],TEXT[1],TEXT[2]);
      rows.forEach(function(r, ri){
        newPageIfNeeded(lineH);
        if(ri%2===1){ doc.setFillColor(244,248,253); doc.rect(marginL, y-3.9, usableW, lineH, 'F'); }
        var x2 = marginL;
        r.forEach(function(cell,ci){
          var txt = String(cell);
          if(aligns[ci]==='right') doc.text(txt, x2+colWidths[ci]-2, y, {align:'right'});
          else doc.text(txt, x2+2, y);
          x2 += colWidths[ci];
        });
        y += lineH;
      });
      doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setLineWidth(0.3);
      doc.line(marginL, y-lineH+1.6, pageW-marginR, y-lineH+1.6);
      y += 3;
    }

    // ----- Header -----
    doc.setFont('helvetica','bold'); doc.setFontSize(16); doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text(state.shop.name||'BILL APP', marginL, y);
    var hy = y+5.5;
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(DIM[0],DIM[1],DIM[2]);
    if(state.shop.address){ doc.text(state.shop.address, marginL, hy); hy += 4.4; }
    if(state.shop.phone){ doc.text('Tel: '+state.shop.phone, marginL, hy); hy += 4.4; }

    doc.setFont('helvetica','bold'); doc.setFontSize(13); doc.setTextColor(INK[0],INK[1],INK[2]);
    doc.text('SALES REPORT', pageW-marginR, 18, {align:'right'});
    doc.setFont('helvetica','normal'); doc.setFontSize(9); doc.setTextColor(DIM[0],DIM[1],DIM[2]);
    doc.text('Period: '+range.label, pageW-marginR, 24, {align:'right'});
    doc.text('Generated: '+new Date().toLocaleString(), pageW-marginR, 29, {align:'right'});

    y = Math.max(hy, 32);
    doc.setDrawColor(INK[0],INK[1],INK[2]); doc.setLineWidth(0.7);
    doc.line(marginL, y, pageW-marginR, y);
    y += 9;

    var data = reportRangeSummary(range.from, range.to);

    // ----- Summary boxes -----
    var boxW = (usableW-8)/3, boxH = 20;
    [
      {label:'TOTAL CASH SALES', val:data.totalCashSales, color:GREEN},
      {label:'TOTAL CHEQUE SALES', val:data.chequeTotal, color:INK},
      {label:'TOTAL CREDIT SALES', val:data.creditBillTotal, color:RED}
    ].forEach(function(b,i){
      var bx = marginL + i*(boxW+4);
      doc.setDrawColor(LINE[0],LINE[1],LINE[2]); doc.setFillColor(248,250,253);
      doc.roundedRect(bx, y, boxW, boxH, 1.6, 1.6, 'FD');
      doc.setFont('helvetica','normal'); doc.setFontSize(8); doc.setTextColor(DIM[0],DIM[1],DIM[2]);
      doc.text(b.label, bx+4, y+7);
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5); doc.setTextColor(b.color[0],b.color[1],b.color[2]);
      doc.text(money(b.val), bx+4, y+15.5);
    });
    y += boxH+10;

    // ----- Cash Sales Details -----
    sectionTitle('Cash Sales Details');
    table(['Date','Bill No','Customer','Amount'],
      data.cashBills.map(function(b){ return [localDay(b.dateISO), b.no||'', b.customerName||'-', money(b.total)]; }),
      [26,32,usableW-26-32-40,40], ['left','left','left','right'], 'No cash sales in this period.');
    kvRow('Cash bills subtotal', money(data.cashBillTotal));
    kvRow('Account payments received (at time of sale)', money(data.acctPaidNow));
    kvRow('Account payments received (against old balance)', money(data.acctReceivePayment));
    kvRow('TOTAL CASH SALES', money(data.totalCashSales), true, GREEN);
    y += 4;

    // ----- Cheque Sales Details -----
    sectionTitle('Cheque Sales Details');
    table(['Date','Bill No','Cheque No','Customer','Amount'],
      data.chequeBills.map(function(b){ return [localDay(b.dateISO), b.no||'', b.chequeNo||'-', b.customerName||'-', money(b.total)]; }),
      [24,26,26,usableW-24-26-26-36,36], ['left','left','left','left','right'], 'No cheque sales in this period.');
    if(data.acctReceivePaymentCheque>0.004){
      kvRow('Account payments received (against old balance)', money(data.acctReceivePaymentCheque));
    }
    kvRow('TOTAL CHEQUE SALES', money(data.chequeTotal), true, INK);
    y += 4;

    // ----- Credit Sales Details -----
    sectionTitle('Credit Sales Details');
    table(['Date','Bill No','Customer','Bill Amount','Balance Due'],
      data.creditBills.map(function(b){ return [localDay(b.dateISO), b.no||'', b.customerName||'-', money(b.total), money(billBalance(b))]; }),
      [24,28,usableW-24-28-36-36,36,36], ['left','left','left','right','right'], 'No credit sales in this period.');
    kvRow('Total credit sales (bill amount)', money(data.creditBillTotal));
    kvRow('Balance due outstanding (this period\'s bills)', money(data.creditBalanceDue), true, RED);
    y += 4;

    // ----- Customer Balances Due -----
    sectionTitle('Customer Balances Due (as of '+new Date().toLocaleDateString()+')');
    var owing = buildCustomerStats().filter(function(c){ return c.totalBalance>0.004; }).sort(function(a,b){ return b.totalBalance-a.totalBalance; });
    table(['Customer','Phone','Balance Due'],
      owing.map(function(c){ return [c.name, c.phone||'-', money(c.totalBalance)]; }),
      [usableW-40-40,40,40], ['left','left','right'], 'No customers currently owe a balance.');
    var totalOwing = owing.reduce(function(s,c){ return s+c.totalBalance; },0);
    kvRow('TOTAL OUTSTANDING (all customers)', money(totalOwing), true, RED);
    y += 4;

    // ----- Sales Summary -----
    sectionTitle('Sales Summary');
    kvRow('Total bills (period)', data.allBills.length);
    kvRow('Total items sold', data.totalItemsSold);
    kvRow('Total revenue (period)', money(data.totalRevenue));
    kvRow('Total discount given', money(data.totalDiscount));
    kvRow('Average bill value', money(data.allBills.length ? data.totalRevenue/data.allBills.length : 0));

    // ----- Footer on every page -----
    var pageCount = doc.internal.getNumberOfPages();
    for(var p=1; p<=pageCount; p++){
      doc.setPage(p);
      doc.setFont('helvetica','normal'); doc.setFontSize(7.5); doc.setTextColor(DIM[0],DIM[1],DIM[2]);
      if(state.shop.footer) doc.text(state.shop.footer, marginL, pageH-10);
      doc.text('Page '+p+' of '+pageCount, pageW-marginR, pageH-10, {align:'right'});
    }
    return doc;
  }

  function monthlyReportFileName(range){
    var shopName = (state.shop.name||'Shop').replace(/[^\w\-]+/g,'_');
    return shopName+'_Sales_Report_'+(range.from||'start')+'_to_'+(range.to||'end')+'.pdf';
  }

  async function shareMonthlyReportPdf(){
    var range = monthlyReportRange();
    if(state.monthlyRepMode==='range' && (!range.from || !range.to)){ alert('Pick both a From and To date first.'); return; }
    var doc = buildMonthlyReportPdf(range);
    if(!doc){ alert('The PDF library is still loading — please try again in a moment.'); return; }
    var fileName = monthlyReportFileName(range);
    var blob = doc.output('blob');
    var file;
    try{ file = new File([blob], fileName, {type:'application/pdf'}); }catch(e){ /* File ctor unsupported */ }
    if(file && navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({files:[file], title:'Sales Report — '+range.label, text:(state.shop.name||'')+' — Sales Report for '+range.label});
        return;
      }catch(e){ if(e && e.name==='AbortError') return; }
    }
    doc.save(fileName);
  }

  function downloadMonthlyReportPdf(){
    var range = monthlyReportRange();
    if(state.monthlyRepMode==='range' && (!range.from || !range.to)){ alert('Pick both a From and To date first.'); return; }
    var doc = buildMonthlyReportPdf(range);
    if(!doc){ alert('The PDF library is still loading — please try again in a moment.'); return; }
    doc.save(monthlyReportFileName(range));
  }

  // ---------------- PROFIT (admin only) ----------------
  // Cost of goods sold for a bill = the sum of the per-line "cost" values
  // recorded at the moment of sale (see completeBill's use of
  // consumeStockFIFO), so this stays accurate even if items' purchase
  // prices change later. Bills placed before this feature existed have
  // no recorded cost and are treated as 0 cost (unknown).
  function billCOGS(b){
    return (b.items||[]).reduce(function(s,it){ return s + (typeof it.cost==='number' ? it.cost : 0); }, 0);
  }
  function billProfit(b){ return b.total - billCOGS(b); }

  function filteredProfitBills(){
    return state.bills.filter(function(b){
      var day = localDay(b.dateISO);
      if(state.profitFrom && day < state.profitFrom) return false;
      if(state.profitTo && day > state.profitTo) return false;
      return true;
    });
  }
  function groupProfitByDay(bills){
    var map = {};
    bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(!map[day]) map[day] = {key:day, label:new Date(day).toLocaleDateString(), revenue:0, cost:0, profit:0, bills:0};
      var cogs = billCOGS(b);
      map[day].revenue += b.total;
      map[day].cost += cogs;
      map[day].profit += (b.total - cogs);
      map[day].bills++;
    });
    return Object.keys(map).sort().reverse().map(function(k){ return map[k]; });
  }
  function groupProfitByMonth(bills){
    var map = {};
    bills.forEach(function(b){
      var mk = monthKey(b.dateISO);
      if(!map[mk]) map[mk] = {key:mk, label:new Date(mk+'-01').toLocaleDateString(undefined,{month:'long', year:'numeric'}), revenue:0, cost:0, profit:0, bills:0};
      var cogs = billCOGS(b);
      map[mk].revenue += b.total;
      map[mk].cost += cogs;
      map[mk].profit += (b.total - cogs);
      map[mk].bills++;
    });
    return Object.keys(map).sort().reverse().map(function(k){ return map[k]; });
  }

  function renderProfit(){
    var bills = filteredProfitBills();
    var totalRevenue = bills.reduce(function(s,b){ return s+b.total; },0);
    var totalCost = bills.reduce(function(s,b){ return s+billCOGS(b); },0);
    var totalProfit = totalRevenue - totalCost;
    var margin = totalRevenue>0 ? (totalProfit/totalRevenue*100) : 0;
    var byBill = state.profitView==='bybill';
    var groups = state.profitView==='monthly' ? groupProfitByMonth(bills) : (byBill ? null : groupProfitByDay(bills));

    var rows;
    if(byBill){
      var billsSorted = bills.slice().sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); });
      rows = billsSorted.map(function(b){
        var cost = billCOGS(b), profit = b.total - cost;
        return '<tr><td>'+b.no+'</td><td>'+new Date(b.dateISO).toLocaleString()+'</td>'+
          '<td>'+(b.customerName?escapeHtml(b.customerName):'<span style="color:var(--text-dim);">—</span>')+'</td>'+
          '<td class="num">'+money(b.total)+'</td><td class="num">'+money(cost)+'</td>'+
          '<td class="num" style="font-weight:700;color:'+(profit>=0?'var(--green)':'var(--red)')+';">'+money(profit)+'</td></tr>';
      }).join('') || '<tr><td colspan="6" style="text-align:center;color:var(--text-dim);padding:18px;">No sales in this range.</td></tr>';
    } else {
      rows = groups.map(function(g){
        return '<tr><td>'+escapeHtml(g.label)+'</td><td class="num">'+g.bills+'</td><td class="num">'+money(g.revenue)+'</td><td class="num">'+money(g.cost)+'</td>'+
          '<td class="num" style="font-weight:700;color:'+(g.profit>=0?'var(--green)':'var(--red)')+';">'+money(g.profit)+'</td></tr>';
      }).join('') || '<tr><td colspan="5" style="text-align:center;color:var(--text-dim);padding:18px;">No sales in this range.</td></tr>';
    }

    var tableHead = byBill ?
      '<tr><th>Bill</th><th>Date</th><th>Customer</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr>' :
      '<tr><th>'+(state.profitView==='monthly'?'Month':'Date')+'</th><th>Bills</th><th>Revenue</th><th>Cost</th><th>Profit</th></tr>';

    return ''+

  // Read-only audit trail: bills deleted ("added in error") and every
  // bill/stock return, newest first. Nothing here can be undone or edited —

  function renderAdminHistory(){
    var delRows = (state.deletedBills||[]).slice().sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); }).map(function(d){

        '<span class="mono" style="font-weight:700;">'+money(d.total)+'</span>'+

  function bindAdminEvents(){
    document.querySelectorAll('[data-atab]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.adminTab = btn.getAttribute('data-atab'); state.itemForm=null; state.userForm=null; render(); });
    });

    document.querySelectorAll('[data-theme-swatch]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        state.shop.themeColor = btn.getAttribute('data-theme-swatch');
        applyTheme();
        render();
        await persist('shop');
      });
    });
    var themeCustom = document.getElementById('s-theme-custom');
    if(themeCustom) themeCustom.addEventListener('input', function(e){
      state.shop.themeColor = e.target.value;
      applyTheme();
    });
    if(themeCustom) themeCustom.addEventListener('change', async function(){
      render();
      await persist('shop');
    });

    // items
    var addItemBtn = document.getElementById('add-item-btn');
    if(addItemBtn) addItemBtn.addEventListener('click', function(){ state.itemForm = {id:null, name:'', category:'', price:0, stock:0, image:'', purchasePrice:0}; render(); });
    document.querySelectorAll('[data-edit-item]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var it = state.items.find(function(i){ return i.id===btn.getAttribute('data-edit-item'); });
        state.itemForm = Object.assign({}, it);
        render();
      });
    });
    document.querySelectorAll('[data-del-item]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-del-item');
        if(!confirm('Delete this item?')) return;
        state.items = state.items.filter(function(i){ return i.id!==id; });
        state.busyMsg = 'Deleting item…';
        render();
        await persist('items');
        state.busyMsg = '';
        render();
      });
    });
    var fSave = document.getElementById('f-save');
    if(fSave) fSave.addEventListener('click', async function(){
      var name = document.getElementById('f-name').value.trim();
      var cat = document.getElementById('f-cat').value.trim();
      var price = parseFloat(document.getElementById('f-price').value)||0;
      var image = state.itemForm.image || '';
      if(!name) return;
      if(state.itemForm.id){
        // Editing: name/category/selling price/image only. Stock and its
        // purchase price are managed via +Restock on the Stock page so
        // earlier batches never get silently overwritten here.
        var it = state.items.find(function(i){ return i.id===state.itemForm.id; });
        it.name=name; it.category=cat; it.price=price; it.image=image;
      } else {
        var stockEl = document.getElementById('f-stock');
        var ppEl = document.getElementById('f-purchase-price');
        var stock = stockEl ? (parseInt(stockEl.value,10)||0) : 0;
        var purchasePrice = ppEl ? (parseFloat(ppEl.value)||0) : 0;
        var batches = stock>0 ? [{id:uid('b'), qty:stock, purchasePrice:purchasePrice, dateISO:new Date().toISOString()}] : [];
        state.items.push({id:uid('it'), name:name, category:cat, price:price, stock:stock, image:image, purchasePrice:purchasePrice, batches:batches});
      }
      state.busyMsg = 'Saving item…';
      render();
      await persist('items');
      state.busyMsg = '';
      state.itemForm = null;
      render();
    });
    function closeItemModal(){ state.itemForm=null; render(); }
    var fCancel = document.getElementById('f-cancel');
    if(fCancel) fCancel.addEventListener('click', closeItemModal);
    var fClose = document.getElementById('f-close');
    if(fClose) fClose.addEventListener('click', closeItemModal);
    var itemModalBg = document.getElementById('item-modal-bg');
    if(itemModalBg) itemModalBg.addEventListener('click', function(e){ if(e.target===itemModalBg) closeItemModal(); });

    function captureItemFormFields(){
      state.itemForm.name = document.getElementById('f-name').value;
      state.itemForm.category = document.getElementById('f-cat').value;
      state.itemForm.price = document.getElementById('f-price').value;
      var stockEl = document.getElementById('f-stock');
      if(stockEl) state.itemForm.stock = stockEl.value;
      var ppEl = document.getElementById('f-purchase-price');
      if(ppEl) state.itemForm.purchasePrice = ppEl.value;
    }
    var fImage = document.getElementById('f-image');
    if(fImage) fImage.addEventListener('change', function(e){
      var file = e.target.files[0];
      if(!file) return;
      captureItemFormFields();
      resizeImageFile(file, 300, function(dataUrl){
        state.itemForm.image = dataUrl;
        render();
      });
    });
    var fImageRemove = document.getElementById('f-image-remove');
    if(fImageRemove) fImageRemove.addEventListener('click', function(){
      captureItemFormFields();
      state.itemForm.image = '';
      render();
    });

    // users
    var addUserBtn = document.getElementById('add-user-btn');
    if(addUserBtn) addUserBtn.addEventListener('click', function(){ state.userForm = {name:'', username:'', password:'', role:'cashier'}; state.userFormErr=''; render(); });
    document.querySelectorAll('[data-edit-user]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-edit-user');
        var u = state.users.find(function(x){ return x.id===id; });
        if(!u) return;
        state.userForm = {id:u.id, name:u.name, username:u.username, password:u.password, role:u.role};
        state.userFormErr='';
        render();
      });
    });
    document.querySelectorAll('[data-del-user]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-del-user');
        if(!confirm('Remove this user?')) return;
        state.users = state.users.filter(function(u){ return u.id!==id; });
        if(state.userForm && state.userForm.id===id) state.userForm=null;
        await persist('users');
        render();
      });
    });
    var uSave = document.getElementById('u-save');
    if(uSave) uSave.addEventListener('click', async function(){
      var name = document.getElementById('u-name').value.trim();
      var username = document.getElementById('u-username').value.trim();
      var password = document.getElementById('u-pass').value;
      var role = document.getElementById('u-role').value;
      var editingId = state.userForm && state.userForm.id;
      if(!name || !username || !password){ state.userFormErr='All fields are required.'; render(); return; }
      if(state.users.some(function(u){ return u.username.toLowerCase()===username.toLowerCase() && u.id!==editingId; })){
        state.userFormErr='That username is already taken.'; render(); return;
      }
      if(editingId){
        var existing = state.users.find(function(u){ return u.id===editingId; });
        if(existing){
          existing.name = name;
          existing.username = username;
          existing.password = password;
          existing.role = role;
          if(state.currentUser && state.currentUser.id===editingId){
            state.currentUser.name = name;
            state.currentUser.username = username;
            state.currentUser.role = role;
          }
        }
      } else {
        state.users.push({id:uid('u'), name:name, username:username, password:password, role:role});
      }
      await persist('users');
      state.userForm=null;
      render();
    });
    var uCancel = document.getElementById('u-cancel');
    if(uCancel) uCancel.addEventListener('click', function(){ state.userForm=null; render(); });

    // printer
    var pConnect = document.getElementById('p-connect');
    if(pConnect) pConnect.addEventListener('click', connectPrinter);
    var pDisconnect = document.getElementById('p-disconnect');
    if(pDisconnect) pDisconnect.addEventListener('click', disconnectPrinter);

    // shop settings
    var sSave = document.getElementById('s-save');
    if(sSave) sSave.addEventListener('click', async function(){
      state.shop.name = document.getElementById('s-name').value.trim() || state.shop.name;
      var appTitleEl = document.getElementById('s-app-title');
      if(appTitleEl) state.shop.appTitle = appTitleEl.value.trim() || 'BILL APP';
      state.shop.address = document.getElementById('s-address').value.trim();
      state.shop.phone = document.getElementById('s-phone').value.trim();
      state.shop.currency = document.getElementById('s-currency').value.trim() || 'Rs.';
      state.shop.footer = document.getElementById('s-footer').value.trim();
      state.shop.width = document.getElementById('s-width').value;
      var billStartVal = parseInt(document.getElementById('s-bill-start').value, 10);
      state.shop.billStart = billStartVal>=1 ? billStartVal : 1;
      var billPrefixEl = document.getElementById('s-bill-prefix');
      if(billPrefixEl) state.shop.billPrefix = billPrefixEl.value.trim() || 'AJ';
      var repLabelEl = document.getElementById('s-rep-label');
      if(repLabelEl) state.shop.repLabel = repLabelEl.value.trim() || 'Sales Rep';
      var repLabelFullEl = document.getElementById('s-rep-label-full');
      if(repLabelFullEl) state.shop.repLabelFull = repLabelFullEl.value.trim() || 'Sales Representative';
      var printToggleEl = document.getElementById('s-printing-enabled');
      if(printToggleEl) state.shop.printingEnabled = printToggleEl.checked;
      sSave.disabled = true;
      sSave.textContent = 'Saving…';
      applyAppTitle();
    applyTheme();
      var ok = await persist('shop');
      state.shopSaveMsg = ok ? {ok:true, text:'Saved.'} : {ok:false, text:'Save failed: '+(state.storageErr||'could not reach the database.')};
      render();
    });

    function captureShopFields(){
      state.shop.name = document.getElementById('s-name').value.trim() || state.shop.name;
      var appTitleEl2 = document.getElementById('s-app-title');
      if(appTitleEl2) state.shop.appTitle = appTitleEl2.value.trim() || 'BILL APP';
      state.shop.address = document.getElementById('s-address').value.trim();
      state.shop.phone = document.getElementById('s-phone').value.trim();
      state.shop.currency = document.getElementById('s-currency').value.trim() || 'Rs.';
      state.shop.footer = document.getElementById('s-footer').value.trim();
      state.shop.width = document.getElementById('s-width').value;
      var billStartVal2 = parseInt(document.getElementById('s-bill-start').value, 10);
      state.shop.billStart = billStartVal2>=1 ? billStartVal2 : 1;
      var billPrefixEl2 = document.getElementById('s-bill-prefix');
      if(billPrefixEl2) state.shop.billPrefix = billPrefixEl2.value.trim() || 'AJ';
      var repLabelEl2 = document.getElementById('s-rep-label');
      if(repLabelEl2) state.shop.repLabel = repLabelEl2.value.trim() || 'Sales Rep';
      var repLabelFullEl2 = document.getElementById('s-rep-label-full');
      if(repLabelFullEl2) state.shop.repLabelFull = repLabelFullEl2.value.trim() || 'Sales Representative';
      var printToggleEl = document.getElementById('s-printing-enabled');
      if(printToggleEl) state.shop.printingEnabled = printToggleEl.checked;
    }
    var sPrintingToggle = document.getElementById('s-printing-enabled');
    if(sPrintingToggle) sPrintingToggle.addEventListener('change', async function(){
      captureShopFields();
      var ok = await persist('shop');
      state.shopSaveMsg = ok ? {ok:true, text:'Saved.'} : {ok:false, text:'Save failed: '+(state.storageErr||'could not reach the database.')};
      render();
    });

    var profitPinSave = document.getElementById('profit-pin-save');
    if(profitPinSave) profitPinSave.addEventListener('click', async function(){
      var cur = document.getElementById('profit-pin-current').value.trim();
      var next = document.getElementById('profit-pin-new').value.trim();
      var conf = document.getElementById('profit-pin-confirm').value.trim();
      var currentPin = state.shop.profitPin || '1234';
      if(cur !== currentPin){ state.profitPinChangeMsg={ok:false,text:'Current PIN is incorrect.'}; render(); return; }
      if(!/^\d{4}$/.test(next)){ state.profitPinChangeMsg={ok:false,text:'New PIN must be exactly 4 digits.'}; render(); return; }
      if(next !== conf){ state.profitPinChangeMsg={ok:false,text:'New PIN and confirmation do not match.'}; render(); return; }
      state.shop.profitPin = next;
      profitPinSave.disabled = true;
      profitPinSave.textContent = 'Saving…';
      var ok = await persist('shop');
      state.profitPinChangeMsg = ok ? {ok:true,text:'PIN changed.'} : {ok:false,text:'Save failed: '+(state.storageErr||'could not reach the database.')};
      render();
    });

  }

  // ---------------- SHELL BIND ----------------
  function bindShell(){
    var retryBootBtn = document.getElementById('retry-boot-btn');
    if(retryBootBtn) retryBootBtn.addEventListener('click', function(){
      state.bootLoadFailed = false;
      state.storageErr = '';
      state.booted = false;
      render();
      boot();
    });
    document.querySelectorAll('[data-nav]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var next = btn.getAttribute('data-nav');
        if(next!=='profit'){ state.profitUnlocked=false; state.profitPinInput=''; state.profitPinErr=''; }
        state.view = next;
        state.itemForm=null; state.userForm=null;
        state.payFormOpenId=null; state.billEditForm=null;
        state.returnForm=null; state.stockReturnForm=null; state.restockForm=null;
        render();
      });
    });
    if(state.view==='billing') bindBillingEvents();
    if(state.view==='accounts') bindAccountsEvents();
    if(state.view==='customers') bindCustomersEvents();
    if(state.view==='stock') bindStockEvents();
    if(state.view==='reports') bindReportsEvents();
    if(state.view==='profit' && state.currentUser.role==='admin'){
      if(state.profitUnlocked) bindProfitEvents(); else bindProfitLockEvents();
    }
    if(state.view==='admin') bindAdminEvents();
    if(state.view==='accounts' || state.view==='stock' || state.view==='reports' || state.view==='customers') bindPageActions();
    if(state.showReceipt) bindReceiptModal();
    if(state.showPaymentReceipt) bindPaymentReceiptModal();
    if(state.printerModalOpen) bindPrinterSettingsModal();

    var topbarReconnect = document.getElementById('topbar-reconnect-printer');
    if(topbarReconnect) topbarReconnect.addEventListener('click', async function(){
      if(state.printer.connected){
        // Already connected — tapping the pill just opens Printer Settings
        // (disconnect/rename/etc.) instead of trying to reconnect.
        state.printerModalOpen = true;
        render();
        return;
      }
      // If the browser already has a device handle from earlier this
      // session, try a silent reattach first (no picker). Otherwise —
      // or if that fails — fall back to the full Connect flow, which
      // needs this click as its "user gesture" to open the device chooser.
      var ok = false;
      if(state.printer.device && !reconnecting){
        ok = await attemptAutoReconnect(state.printer.device, 2);
      }
      if(!ok && !state.printer.connected){
        await connectPrinter();
      }
    });
  }

  if('serviceWorker' in navigator){
    window.addEventListener('load', function(){
      navigator.serviceWorker.register('service-worker.js').catch(function(){});
    });
  }

  boot();
})();
</script>
</body>
</html>
