  // Mixes a hex color toward white by the given fraction (0-1), used to
  // derive the lighter shade for gradients/hovers from a single admin-picked
  // accent color.
  function lightenHex(hex, amt){
    var h = (hex||'').replace('#','');
    if(h.length===3) h = h.split('').map(function(c){ return c+c; }).join('');
    if(!/^[0-9a-fA-F]{6}$/.test(h)) return hex;
    var r = parseInt(h.substr(0,2),16), g = parseInt(h.substr(2,2),16), b = parseInt(h.substr(4,2),16);
    r = Math.round(r + (255-r)*amt);
    g = Math.round(g + (255-g)*amt);
    b = Math.round(b + (255-b)*amt);
    return '#'+[r,g,b].map(function(v){ return v.toString(16).padStart(2,'0'); }).join('');
  }

  // Applies the admin-chosen accent color to the CSS custom properties that
  // drive buttons, links, and highlights throughout the app.
  function applyTheme(){
    var color = (state.shop && state.shop.themeColor) ? state.shop.themeColor : '#2563EB';
    if(!/^#[0-9a-fA-F]{6}$/.test(color)) color = '#2563EB';
    document.documentElement.style.setProperty('--green', color);
    document.documentElement.style.setProperty('--green-light', lightenHex(color, 0.28));
  }

  async function boot(){
    // Fast path: hydrate instantly from the local cache (if any) so the
    // app can paint real data right away instead of the loading spinner,
    // while the Google Sheet round-trip (often slow) happens underneath.
    // The live fetch below still runs immediately after and overwrites
    // this — the cache is only ever a head start, never a replacement.
    var cached = loadLocalCache();
    if(cached){
      if(cached.items) state.items = cached.items;
      if(cached.users) state.users = cached.users;
      if(cached.bills) state.bills = cached.bills;
      if(cached.shop) state.shop = Object.assign({}, state.shop, cached.shop);
      if(cached.returns) state.returns = cached.returns;
      if(cached.deletedBills) state.deletedBills = cached.deletedBills;
      if(cached.printers) state.printerHistory = cached.printers;
      state.items.forEach(ensureItemBatches);
      applyAppTitle();
      applyTheme();
      state.booted = true;
    }
    // Paint the Admin/Cashier picker right away — it doesn't need any
    // fetched data to display, so there's no reason to make the person
    // stare at a blank screen while these requests are still in flight.
    render();
    // Fire all 6 reads in parallel instead of one-by-one — Apps Script
    // requests are slow (often 1-3s each), so awaiting them sequentially
    // could take 4x as long as it needs to. Promise.allSettled (not
    // Promise.all) so that one failed/slow key doesn't hide whether the
    // others actually succeeded — each is checked individually below.
    var settled = await Promise.allSettled([
      storageGet(STORE_KEY_ITEMS),
      storageGet(STORE_KEY_USERS),
      storageGet(STORE_KEY_BILLS),
      storageGet(STORE_KEY_SHOP),
      storageGet(STORE_KEY_PRINTERS),
      storageGet(STORE_KEY_RETURNS),
      storageGet(STORE_KEY_DELETED_BILLS)
    ]);
    var itemsR = settled[0], usersR = settled[1], billsR = settled[2], shopR = settled[3], printersR = settled[4], returnsR = settled[5], deletedBillsR = settled[6];
    var items = itemsR.status==='fulfilled' ? itemsR.value : undefined;
    var users = usersR.status==='fulfilled' ? usersR.value : undefined;
    var bills = billsR.status==='fulfilled' ? billsR.value : undefined;
    var shop = shopR.status==='fulfilled' ? shopR.value : undefined;
    var printers = printersR.status==='fulfilled' ? printersR.value : undefined;
    var returns = returnsR.status==='fulfilled' ? returnsR.value : undefined;
    var anyFailed = settled.some(function(s){ return s.status==='rejected'; });

    if(itemsR.status==='rejected' || usersR.status==='rejected'){
      // The items/users requests didn't just come back empty — they
      // FAILED (network drop, Apps Script timeout, etc.). There's no way
      // to tell "empty" from "couldn't check" here, so never guess.
      // Guessing wrong is exactly what used to wipe a real shop's items
      // and users and replace them with the demo starter data below.
      // Leave state.items/users untouched and touch NO storage at all.
    } else if(!items || !users){
      // Both requests genuinely reached the sheet and came back with
      // nothing saved — this really is a first run, so it's safe to seed
      // starter data and push it up.
      seedDefaults();
      await Promise.all([
        storageSet(STORE_KEY_ITEMS, state.items),
        storageSet(STORE_KEY_USERS, state.users),
        storageSet(STORE_KEY_BILLS, state.bills),
        storageSet(STORE_KEY_SHOP, shopForStorage(state.shop)),
        storageSet(STORE_KEY_RETURNS, state.returns),
        storageSet(STORE_KEY_DELETED_BILLS, state.deletedBills)
      ]);
    } else {
      state.items = items;
      state.users = users;
      if(billsR.status==='fulfilled') state.bills = bills || [];
      if(returnsR.status==='fulfilled') state.returns = returns || [];
      if(deletedBillsR.status==='fulfilled') state.deletedBills = deletedBillsR.value || [];
      if(shop) state.shop = Object.assign({}, state.shop, shop);
    }
    if(anyFailed){
      // Something didn't load (maybe just Printers or Returns, maybe
      // Items/Users) — surface it rather than silently showing partial/
      // stale data as if everything loaded fine.
      state.bootLoadFailed = true;
      state.storageErr = state.storageErr || 'One or more requests to the database failed.';
    }
    applyAppTitle();
    applyTheme();
    if(printersR.status==='fulfilled') state.printerHistory = printers || [];
    // Backfill batches for items saved before purchase-price tracking existed.
    state.items.forEach(ensureItemBatches);
    // Refresh the fast-load cache with this confirmed-live data (only once
    // items/users actually came from the Sheet — never cache the "request
    // failed, kept old state" case as if it were fresh).
    if(itemsR.status==='fulfilled' && usersR.status==='fulfilled') saveLocalCache();
    try{
      var lastPrinter = localStorage.getItem(PRINTER_STORE_KEY);
      if(lastPrinter) state.printer.status = 'Last used: '+lastPrinter+'. Reconnecting…';
    }catch(e){}
    state.booted = true;
    render();
    if(!anyFailed) syncReadableSheets();
    // Fire-and-forget: try to silently reattach to the last printer without
    // blocking the rest of boot. If the browser didn't keep permission, this
    // no-ops and the status message below just falls back to "tap Connect".
    trySilentReconnect().then(function(){
      if(!state.printer.connected && !state.printer.device){
        try{
          var lp = localStorage.getItem(PRINTER_STORE_KEY);
          if(lp) state.printer.status = 'Last used: '+lp+'. Tap Connect to reconnect.';
        }catch(e){}
        render();
      }
    });
  }

  // The shop object carries a large built-in placeholder logo (~95KB of
  // base64 image data) that has no UI to change it and isn't actually
  // used when printing — it only ever gets read out for the "Logo" mirror
  // tab. Uploading that same ~95KB again on every single "Save shop
  // settings" click was the main reason those saves were failing with
  // "Failed to fetch" on slower/mobile connections (item/user saves stay
  // small and go through fine). Strip it out of what actually gets sent.
  function shopForStorage(shop){
    var copy = Object.assign({}, shop);
    delete copy.logo;
    return copy;
  }

  async function persist(key){
    var ok;
    if(key==='items') ok = await storageSet(STORE_KEY_ITEMS, state.items);
    if(key==='users') ok = await storageSet(STORE_KEY_USERS, state.users);
    if(key==='bills') ok = await storageSet(STORE_KEY_BILLS, state.bills);
    if(key==='shop') ok = await storageSet(STORE_KEY_SHOP, shopForStorage(state.shop));
    if(key==='returns') ok = await storageSet(STORE_KEY_RETURNS, state.returns);
    if(key==='deletedBills') ok = await storageSet(STORE_KEY_DELETED_BILLS, state.deletedBills);
    // Fire-and-forget: also mirror the data into separate, human-readable
    // tabs in the same Google Sheet (Bills, Shop Details, Customers,
    // Customer Statement, Stock, Stock In-Out, Accounts, Cheque Details,
    // Daily Sales, Profit, Cash In Hand). This never blocks the UI and a
    // failure here never affects the app's own working data above.
    // The key is passed through so a save that only touches one tab's
    // data (shop settings) doesn't also kick off all 12 other tab
    // rebuilds+uploads — that background flood of requests was the main
    // thing making shop-settings saves feel sluggish.
    if(ok) syncReadableSheets(key);
    if(ok) saveLocalCache();
    return ok;
  }

  // ---------------- READABLE SHEET TABS (mirror) ----------------
  var sheetSyncInFlight = false;
  function syncReadableSheets(onlyKey){
    if(!sheetConfigured()) return;
    if(sheetSyncInFlight) return; // last write wins is fine; just avoid piling up requests
    sheetSyncInFlight = true;
    var tabs = (onlyKey === 'shop')
      ? [ {sheet:'Shop Details & Bill Settings', headers:SHOP_HEADERS, rows:buildShopRows()} ]
      : [
          {sheet:'Bills Details (All Bills)', headers:BILLS_HEADERS, rows:buildBillsRows()},
          {sheet:'Bills Details (By Date)', headers:BILLS_BY_DATE_HEADERS, rows:buildBillsByDateRows()},
          {sheet:'Customers Full Details', headers:CUSTOMERS_HEADERS, rows:buildCustomersRows()},
          {sheet:'Customer Statement', headers:CUSTOMER_STATEMENT_HEADERS, rows:buildCustomerStatementRows()},
          {sheet:'Stock Details', headers:STOCK_HEADERS, rows:buildStockRows()},
          {sheet:'Stock In-Out', headers:STOCK_MOVEMENTS_HEADERS, rows:buildStockMovementsRows()},
          {sheet:'Cash Sales (By Date)', headers:CASH_SALES_BY_DATE_HEADERS, rows:buildCashSalesByDateRows()},
          {sheet:'Cheque Sales (By Date)', headers:CHEQUE_SALES_BY_DATE_HEADERS, rows:buildChequeSalesByDateRows()},
          {sheet:'Credit Sales (By Date)', headers:CREDIT_SALES_BY_DATE_HEADERS, rows:buildCreditSalesByDateRows()},
          {sheet:'Profit', headers:PROFIT_HEADERS, rows:buildProfitRows()},
          {sheet:'Shop Details & Bill Settings', headers:SHOP_HEADERS, rows:buildShopRows()},
          {sheet:'Cheque Details', headers:CHEQUE_HEADERS, rows:buildChequeRows()},
          {sheet:'Account Details', headers:ACCOUNTS_HEADERS, rows:buildAccountsRows()},
          {sheet:'Sales by day', headers:DAILY_SALES_HEADERS, rows:buildDailySalesRows()},
          {sheet:'Cash In Hand', headers:CASH_HEADERS, rows:buildCashInHandRows()},
          {sheet:'Logo', headers:LOGO_HEADERS, rows:buildLogoRows()},
          {sheet:'Printers', headers:PRINTERS_HEADERS, rows:buildPrintersRows()},
          {sheet:'Returns', headers:RETURNS_HEADERS, rows:buildReturnsRows()}
        ];
    // All tabs go in ONE request now (action:'syncAllTabs'), not 17
    // concurrent ones. Firing 17 simultaneous fetches at the same Apps
    // Script Web App right after every save was eating up the account's
    // simultaneous-execution slots, so the real (locked) items/bills save
    // could end up queued behind that flood long enough to time out even
    // though the lock itself was never actually stuck for 45s.
    storageSyncAllTabs(tabs).catch(function(){}).then(function(){ sheetSyncInFlight = false; });
  }

  async function storageSyncAllTabs(tabs){
    if(!sheetConfigured()) return false;
    try{
      var res = await fetch(CONFIG.SHEET_API_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'}, // avoids CORS preflight
        body: JSON.stringify({ action:'syncAllTabs', tabs:tabs })
      });
      if(!res.ok) throw new Error('HTTP '+res.status);
      var text = await res.text();
      var data = JSON.parse(text);
      if(data && data.error) throw new Error(data.error);
      return true;
    }catch(e){ return false; } // mirror tabs are non-critical — app keeps working either way
  }

  var BILLS_HEADERS = ['Bill No','Date','Time','Cashier','Customer Name','Phone','Address','Items','Subtotal','Discount','Total','Payment Method','Paid','Balance','Status'];
  function buildBillsRows(){
    return state.bills.map(function(b){
      var d = new Date(b.dateISO);
      var itemsSummary = (b.items||[]).map(function(it){ return it.name+' x'+it.qty; }).join('; ');
      return [
        b.no||'', d.toLocaleDateString(), d.toLocaleTimeString(), b.cashier||'',
        b.customerName||'', b.customerPhone||'', b.customerAddress||'',
        itemsSummary, b.subtotal||0, b.discount||0, b.total||0,
        b.payment||'', billPaidTotal(b), billBalance(b), billStatus(b)
      ];
    });
  }

  // Same bills as above, but grouped under a "Date: ..." summary row per
  // day (most recent day first) so the tab reads as separate date sections
  // instead of one flat list — mirrors the Reports page's "Sales by day"
  // expandable table.
  var BILLS_BY_DATE_HEADERS = ['Date / Bill No','Time','Cashier','Customer Name','Phone','Payment','Items','Total'];
  function buildBillsByDateRows(){
    var byDay = groupBillsByDay(state.bills.slice());
    var rows = [];
    byDay.forEach(function(d){
      rows.push(['— '+d.date+'  ('+d.bills.length+' bill'+(d.bills.length===1?'':'s')+', total '+money(d.total)+') —','','','','','','','']);
      d.bills.slice().reverse().forEach(function(b){
        var dt = new Date(b.dateISO);
        var itemsSummary = (b.items||[]).map(function(it){ return it.name+' x'+it.qty; }).join('; ');
        rows.push([b.no||'', dt.toLocaleTimeString(), b.cashier||'', b.customerName||'', b.customerPhone||'', b.payment||'', itemsSummary, b.total||0]);
      });
      rows.push(['','','','','','','','']);
    });
    return rows;
  }


  var SHOP_HEADERS = ['Field','Value'];
  function buildShopRows(){
    var s = state.shop||{};
    return [
      ['Shop Name', s.name||''],
      ['Address', s.address||''],
      ['Phone', s.phone||''],
      ['Currency', s.currency||''],
      ['Receipt Footer', s.footer||''],
      ['Receipt Width', s.width||''],
      ['Bill Prefix', s.billPrefix||''],
      ['Bill Start No', s.billStart||''],
      ['Sales Rep Role Name (Short)', s.repLabel||''],
      ['Sales Rep Role Name (Full)', s.repLabelFull||''],
      ['Printing Enabled', s.printingEnabled ? 'Yes' : 'No']
    ];
  }

  var CUSTOMERS_HEADERS = ['Customer Name','Phone','Address','Total Bills','Total Spent','Balance Owing','Last Purchase Date'];
  function buildCustomersRows(){
    var map = {};
    state.bills.forEach(function(b){
      var name = (b.customerName||'').trim();
      if(!name) return;
      var key = name.toLowerCase()+'|'+(b.customerPhone||'').trim();
      if(!map[key]) map[key] = {name:name, phone:b.customerPhone||'', address:b.customerAddress||'', bills:0, spent:0, balance:0, last:b.dateISO};
      var c = map[key];
      c.bills += 1;
      c.spent += b.total||0;
      c.balance += billBalance(b);
      if(b.customerAddress) c.address = b.customerAddress;
      if(new Date(b.dateISO) > new Date(c.last)) c.last = b.dateISO;
    });
    return Object.keys(map).map(function(k){
      var c = map[k];
      return [c.name, c.phone, c.address, c.bills, Math.round(c.spent*100)/100, Math.round(c.balance*100)/100, new Date(c.last).toLocaleDateString()];
    });
  }

  var STOCK_HEADERS = ['Item Name','Category','Selling Price','Purchase Price','Current Stock','Status'];
  function buildStockRows(){
    return state.items.map(function(it){
      var status = it.stock<=0 ? 'Out of stock' : (it.stock<=5 ? 'Low stock' : 'OK');
      return [it.name, it.category||'', it.price||0, it.purchasePrice||0, it.stock||0, status];
    });
  }

  var DAILY_SALES_HEADERS = ['Date','Bills Count','Total Sales','Total Discount','Cash Sales','Cheque Sales','Account Sales'];
  function buildDailySalesRows(){
    var map = {};
    state.bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(!day) return;
      if(!map[day]) map[day] = {date:day, bills:0, sales:0, discount:0, cash:0, cheque:0, account:0};
      var e = map[day];
      e.bills += 1;
      e.sales += b.total||0;
      e.discount += b.discount||0;
      if(b.payment==='cash') e.cash += b.total||0;
      else if(b.payment==='cheque') e.cheque += b.total||0;
      else if(b.payment==='account') e.account += b.total||0;
    });
    return Object.keys(map).sort().reverse().map(function(k){
      var e = map[k];
      return [e.date, e.bills, Math.round(e.sales*100)/100, Math.round(e.discount*100)/100, Math.round(e.cash*100)/100, Math.round(e.cheque*100)/100, Math.round(e.account*100)/100];
    });
  }

  // Every distinct calendar day that has a bill or an account payment on
  // it, most recent first — shared by the three "…by date" tabs below.
  function allReportDates(){
    var set = {};
    state.bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(day) set[day] = true;
      (b.payments||[]).forEach(function(p){
        var pd = localDay(p.dateISO);
        if(pd) set[pd] = true;
      });
    });
    return Object.keys(set).sort().reverse();
  }

  // Cash Sales (By Date) — same formula as the Reports page banner:
  // cash bills that day + "Amount received now" on account bills that day
  // + "Receive Payment" collected that day against older account balances.
  var CASH_SALES_BY_DATE_HEADERS = ['Date','Cash Bills','Amount Received Now (Account)','Receive Payment (Old Bill Balance)','Total Cash Sales'];
  function buildCashSalesByDateRows(){
    return allReportDates().map(function(date){
      var s = selectedDateSummary(date);
      return [date, Math.round(s.cashBillAmt*100)/100, Math.round(s.acctPaidNow*100)/100, Math.round(s.acctReceivePaymentCash*100)/100, Math.round(s.cashSales*100)/100];
    });
  }

  // Cheque Sales (By Date) — cheque bills grouped per day, plus any
  // "Receive Payment" collections that day recorded as Cheque.
  var CHEQUE_SALES_BY_DATE_HEADERS = ['Date','Cheque Bills','Receive Payment (Old Bill Balance)','Total Cheque Sales'];
  function buildChequeSalesByDateRows(){
    var byDay = groupBillsByDay(state.bills.filter(function(b){ return b.payment==='cheque'; }));
    var map = {};
    byDay.forEach(function(d){ map[d.date] = {date:d.date, bills:d.bills.length, billTotal:d.total, recv:0}; });
    allReportDates().forEach(function(date){
      var s = selectedDateSummary(date);
      if(s.acctReceivePaymentCheque>0.004){
        if(!map[date]) map[date] = {date:date, bills:0, billTotal:0, recv:0};
        map[date].recv = s.acctReceivePaymentCheque;
      }
    });
    return Object.keys(map).sort().reverse().map(function(k){
      var e = map[k];
      return [e.date, e.bills, Math.round(e.recv*100)/100, Math.round((e.billTotal+e.recv)*100)/100];
    });
  }

  // Credit Sales (By Date) — account (credit) bills raised per day, plus
  // the balance still outstanding on those bills (same "Credit Sales"
  // figure shown in the Reports page banner).
  var CREDIT_SALES_BY_DATE_HEADERS = ['Date','Credit Bills','Total Credit Sales (Bill Total)','Balance Due Outstanding'];
  function buildCreditSalesByDateRows(){
    var byDay = groupBillsByDay(state.bills.filter(function(b){ return b.payment==='account'; }));
    return byDay.map(function(d){
      var balanceDue = d.bills.reduce(function(s,b){ return s+billBalance(b); },0);
      return [d.date, d.bills.length, Math.round(d.total*100)/100, Math.round(balanceDue*100)/100];
    });
  }

  var PROFIT_HEADERS = ['Date','Bills Count','Revenue','Cost (COGS)','Profit','Margin %'];
  function buildProfitRows(){
    return groupProfitByDay(state.bills).map(function(r){
      var margin = r.revenue>0 ? (r.profit/r.revenue*100) : 0;
      return [r.key, r.bills, Math.round(r.revenue*100)/100, Math.round(r.cost*100)/100, Math.round(r.profit*100)/100, Math.round(margin*100)/100];
    });
  }

  var CASH_HEADERS = ['Date','Cash Sales','Cash Received (Account Payments)','Total Cash In Hand'];
  function buildCashInHandRows(){
    var map = {};
    function ensure(day){ if(!map[day]) map[day] = {date:day, cash:0, received:0}; return map[day]; }
    state.bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(!day) return;
      if(b.payment==='cash') ensure(day).cash += b.total||0;
    });
    state.bills.forEach(function(b){
      if(b.payment!=='account') return;
      (b.payments||[]).forEach(function(p){
        var day = localDay(p.dateISO);
        if(!day) return;
        if(p.note!=='Payment at time of sale' && p.method==='cheque') return; // cheque collections aren't cash in hand
        ensure(day).received += p.amount||0;
      });
    });
    return Object.keys(map).sort().reverse().map(function(k){
      var e = map[k];
      var total = e.cash + e.received;
      return [e.date, Math.round(e.cash*100)/100, Math.round(e.received*100)/100, Math.round(total*100)/100];
    });
  }

  var STOCK_MOVEMENTS_HEADERS = ['Date','Time','Item Name','Type','Quantity'];
  // Reuses the same in/out movement log that powers the on-screen "Stock
  // In / Out & Bills Summary" card, just flattened to one row per
  // movement instead of grouped by day/month. Quantity is signed
  // (+ for in, - for out) so summing the column gives the net stock change.
  function buildStockMovementsRows(){
    var moves = buildStockMovements().slice().sort(function(a,b){ return new Date(a.dateISO)-new Date(b.dateISO); });
    return moves.map(function(m){
      var d = new Date(m.dateISO);
      return [d.toLocaleDateString(), d.toLocaleTimeString(), m.itemName, m.type==='in'?'IN':'OUT', m.type==='in'?m.qty:-m.qty];
    });
  }

  var ACCOUNTS_HEADERS = ['Bill No','Date','Customer Name','Phone','Bill Total','Paid So Far','Balance Due','Status'];
  // Mirrors the Accounts page: every "on account" (credit) bill, however
  // it currently stands — paid, partially paid, or still unpaid.
  function buildAccountsRows(){
    return state.bills.filter(function(b){ return b.payment==='account'; }).map(function(b){
      var d = new Date(b.dateISO);
      return [b.no||'', d.toLocaleDateString(), b.customerName||'', b.customerPhone||'', b.total||0,
        Math.round(billPaidTotal(b)*100)/100, billBalance(b), billStatus(b)];
    });
  }

  var CHEQUE_HEADERS = ['Bill No','Date','Cheque No','Customer Name','Phone','Type','Amount'];
  function buildChequeRows(){
    var billRows = state.bills.filter(function(b){ return b.payment==='cheque'; }).map(function(b){
      var d = new Date(b.dateISO);
      return {sortD: d, row: [b.no||'', d.toLocaleDateString(), b.chequeNo||'', b.customerName||'', b.customerPhone||'', 'Cheque bill', b.total||0]};
    });
    var recoveryRows = [];
    state.bills.forEach(function(b){
      if(b.payment!=='account') return;
      (b.payments||[]).forEach(function(p){
        if(p.note==='Payment at time of sale') return;
        if(p.method!=='cheque') return;
        var d = new Date(p.dateISO);
        recoveryRows.push({sortD: d, row: [b.no||'', d.toLocaleDateString(), '', b.customerName||'', b.customerPhone||'', 'Receive Payment', p.amount||0]});
      });
    });
    return billRows.concat(recoveryRows).sort(function(a,b){ return a.sortD-b.sortD; }).map(function(e){ return e.row; });
  }

  var PRINTERS_HEADERS = ['Printer Name','First Connected','Last Connected','Times Connected'];
  function buildPrintersRows(){
    return state.printerHistory.slice().sort(function(a,b){ return new Date(b.lastConnected)-new Date(a.lastConnected); }).map(function(p){
      var first = p.firstConnected ? new Date(p.firstConnected) : null;
      var last = p.lastConnected ? new Date(p.lastConnected) : null;
      return [p.name||'', first?first.toLocaleString():'', last?last.toLocaleString():'', p.timesConnected||0];
    });
  }

  // Every bill return and every standalone stock return, on its own sheet
  // tab (separate from Bills/Stock) so returns can be reviewed/audited on
  // their own — one row per return event.
  var RETURNS_HEADERS = ['Date','Type','Bill No','Customer Name','Item(s)','Quantity','Amount','Reason','Processed By'];
  function buildReturnsRows(){
    var rows = (state.returns||[]).slice().sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); }).map(function(r){
      var d = new Date(r.dateISO);
      var itemsSummary = (r.items||[]).map(function(it){ return it.name+' x'+it.qty; }).join('; ');
      var qtyTotal = (r.items||[]).reduce(function(s,it){ return s+(Number(it.qty)||0); },0);
      return [
        d.toLocaleDateString()+' '+d.toLocaleTimeString(),
        r.type==='stock' ? 'Stock Return' : 'Bill Return',
        r.billNo||'',
        r.customerName||'',
        itemsSummary,
        qtyTotal,
        Math.round((r.amount||0)*100)/100,
        r.reason||'',
        r.processedBy||''
      ];
    });
    return rows;
  }

  var CUSTOMER_STATEMENT_HEADERS = ['Customer Name','Phone','Bill No','Date','Payment Method','Bill Total','Paid','Balance Due'];
  // One row per bill, grouped by customer (A-Z) then oldest-first — sort
  // or filter this tab by Customer Name in Sheets to pull up any one
  // customer's full statement. Aggregate totals per customer already live
  // on the Customers tab, so this stays a flat list (no subtotal rows)
  // so any SUM() you add over the amount columns stays accurate.
  function buildCustomerStatementRows(){
    var customers = buildCustomerStats().slice().sort(function(a,b){ return a.name.localeCompare(b.name); });
    var rows = [];
    customers.forEach(function(c){
      var bills = c.bills.slice().sort(function(a,b){ return new Date(a.dateISO)-new Date(b.dateISO); });
      bills.forEach(function(b){
        var d = new Date(b.dateISO);
        rows.push([c.name, c.phone||'', b.no||'', d.toLocaleDateString(), b.payment||'', b.total||0,
          Math.round(billPaidTotal(b)*100)/100, billBalance(b)]);
      });
    });
    return rows;
  }

  // Google Sheets caps a single cell at 50,000 characters, and a resized
  // logo's base64 data URL can be longer than that — so it's split into
  // multiple "Logo Data Part N" rows, each safely under the limit, and
  // reassembled (Part 1 + Part 2 + ...) if you ever need to recover the image.
  var LOGO_HEADERS = ['Field','Value'];
  function buildLogoRows(){
    var s = state.shop||{};
    var logo = s.logo||'';
    if(!logo) return [['Logo Present','No']];
    var rows = [['Logo Present','Yes']];
    var fmtMatch = /^data:image\/([a-zA-Z0-9.+-]+);base64,/.exec(logo);
    rows.push(['Format', fmtMatch ? fmtMatch[1].toUpperCase() : 'Unknown']);
    var approxKB = Math.round(logo.length*3/4/1024*10)/10;
    rows.push(['Approx Size (KB)', approxKB]);
    var chunkSize = 40000;
    var totalParts = Math.ceil(logo.length/chunkSize) || 1;
    rows.push(['Data Parts', totalParts]);
    for(var i=0;i<totalParts;i++){
      rows.push(['Logo Data Part '+(i+1), logo.substr(i*chunkSize, chunkSize)]);
    }
    return rows;
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }

  // Resize/compress an uploaded image file to a small JPEG data URL so it's
  // cheap to store (localStorage/Sheet) and quick to send to the printer.
  // keepTransparent=true skips the white background fill and saves as PNG
  // instead of JPEG, so a logo with a transparent background doesn't end
  // up with a white box behind it. Product photos still default to a
  // white-filled JPEG (smaller file size, no transparency needed).
  function resizeImageFile(file, maxDim, cb, keepTransparent){
    if(!file) return cb(null);
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
        var w = Math.max(1, Math.round(img.width*scale));
        var h = Math.max(1, Math.round(img.height*scale));
        var canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        var ctx = canvas.getContext('2d');
        if(!keepTransparent){
          ctx.fillStyle = '#FFFFFF';
          ctx.fillRect(0,0,w,h);
        }
        ctx.drawImage(img, 0, 0, w, h);
        cb(keepTransparent ? canvas.toDataURL('image/png') : canvas.toDataURL('image/jpeg', 0.82));
      };
      img.onerror = function(){ cb(null); };
      img.src = e.target.result;
    };
    reader.onerror = function(){ cb(null); };
    reader.readAsDataURL(file);
  }

    // Render every tile up front (not just the ones matching the current

    // down and rebuilding the whole grid on every keystroke — that rebuild

    var tiles = state.items.map(function(it){

      '</button>';

    return tiles + '<div class="empty-note" id="item-empty-note" style="display:none;">No items match your search.</div>';

  // Re-renders just one DOM region instead of the whole page, and restores
  // focus/cursor position into it afterwards if the user was typing there.
  function refreshRegion(container, htmlFn, bindFn){
    if(!container) return;
    var active = document.activeElement;
    var focusId = (active && active.id && container.contains(active)) ? active.id : null;
    var selStart = null, selEnd = null;
    if(focusId && typeof active.selectionStart === 'number'){
      try{ selStart = active.selectionStart; selEnd = active.selectionEnd; }catch(e){}
    }
    container.innerHTML = htmlFn();
    bindFn();
    if(focusId){
      var el = document.getElementById(focusId);
      if(el){
        el.focus();
        if(selStart!=null && el.setSelectionRange){ try{ el.setSelectionRange(selStart, selEnd); }catch(e){} }
      }
    }
  }

  function refreshItemGrid(){
    refreshRegion(document.getElementById('item-grid'), renderItemTilesHtml, bindItemGridEvents);
  }
  function refreshCartBody(){
    refreshRegion(document.getElementById('cart-body'), renderCartBodyHtml, bindCartBodyEvents);
  }
  var refreshItemGridDebounced = debounce(refreshItemGrid, 120);
  var refreshCartBodyDebounced = debounce(refreshCartBody, 120);

  function billPaidTotal(b){ return (b.payments||[]).reduce(function(s,p){ return s+p.amount; },0); }
  function billBalance(b){
    if(b.payment!=='account') return 0;
    return Math.round((b.total - billPaidTotal(b))*100)/100;
  }
  function billStatus(b){
    if(b.payment!=='account') return 'paid';
    var bal = billBalance(b);
    if(bal<=0.004) return 'paid';
    if(billPaidTotal(b)>0) return 'partial';
    return 'unpaid';
  }

  // Selected-date summary for the 3 Reports banners.
  //  - Cash sales      = cash bills that day + "Amount received now" collected on account
  //                      bills that day (recorded at time of sale) + payments received that
  //                      day against older account bills' balance due ("Receive Payment").
  //  - Cheque sales    = cheque bills that day.
  //  - Credit sales    = balance due (unpaid) on account bills raised that day.
  function selectedDateSummary(date){
    date = date || todayISO();
    var cashBillAmt = 0, acctPaidNow = 0, acctReceivePaymentCash = 0, acctReceivePaymentCheque = 0, chequeAmt = 0, creditBalance = 0;
    state.bills.forEach(function(b){
      var billDay = localDay(b.dateISO);
      if(b.payment==='cash' && billDay===date) cashBillAmt += (b.total||0);
      else if(b.payment==='cheque' && billDay===date) chequeAmt += (b.total||0);
      else if(b.payment==='account' && billDay===date) creditBalance += billBalance(b);
      if(b.payment==='account'){
        (b.payments||[]).forEach(function(p){
          if(localDay(p.dateISO)!==date) return;
          if(p.note==='Payment at time of sale') acctPaidNow += (p.amount||0);
          else if(p.method==='cheque') acctReceivePaymentCheque += (p.amount||0);
          else acctReceivePaymentCash += (p.amount||0);
        });
      }
    });
    var acctReceivePayment = acctReceivePaymentCash + acctReceivePaymentCheque;
    return {
      date: date,
      cashBillAmt: cashBillAmt,
      acctPaidNow: acctPaidNow,
      acctReceivePayment: acctReceivePayment,
      acctReceivePaymentCash: acctReceivePaymentCash,
      acctReceivePaymentCheque: acctReceivePaymentCheque,
      cashSales: cashBillAmt + acctPaidNow + acctReceivePaymentCash,
      chequeSales: chequeAmt + acctReceivePaymentCheque,
      creditSales: creditBalance
    };
  }

  // Locates one specific payment on a bill (by id) and works out the
  // running balance immediately before and after it, so a receipt for
  // that single payment can show "was owing X, paid Y, now owing Z" even
  // if other payments were made before or after it.
  function findPaymentContext(billId, paymentId){
    var bill = state.bills.find(function(b){ return b.id===billId; });
    if(!bill) return null;
    var payments = bill.payments || [];
    var idx = payments.findIndex(function(p){ return p.id===paymentId; });
    if(idx<0) return null;
    var paidBefore = payments.slice(0, idx).reduce(function(s,p){ return s+p.amount; },0);
    var paidThrough = paidBefore + payments[idx].amount;
    return {
      bill: bill,
      payment: payments[idx],
      balanceBefore: Math.round((bill.total - paidBefore)*100)/100,
      balanceAfter: Math.round((bill.total - paidThrough)*100)/100
    };
  }

  function currentTotals(){
    var subtotal = state.cart.reduce(function(s,c){ return s+c.price*c.qty; },0);
    var discount = state.discountType==='percent' ? subtotal*(state.discountVal/100) : Number(state.discountVal||0);
    discount = Math.min(discount, subtotal);
    return {subtotal:subtotal, discount:discount, total:subtotal-discount};
  }

  // Patches just the Subtotal/Discount/Total numbers in place. Used while
  // the discount type/value is being edited so the discount input itself
  // (and everything else in the cart) never gets torn down and rebuilt —

  function updateCartTotals(){

    var elDisc = document.getElementById('sum-discount');

  function bindBillingEvents(){

  // Only re-binds the tiles inside #item-grid — safe to call after
  // anything that replaces #item-grid's innerHTML (e.g. a full render()).
  function bindItemGridEvents(){
    document.querySelectorAll('[data-add]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-add');
        var item = state.items.find(function(i){ return i.id===id; });
        if(!item || item.stock<=0) return;
        var existing = state.cart.find(function(c){ return c.id===id; });
        var inCart = existing ? existing.qty : 0;
        if(inCart>=item.stock) return;
        if(existing) existing.qty++;
        else state.cart.push({id:item.id, name:item.name, price:item.price, qty:1});
        refreshCartBody();
      });
    });
  }

  // Customer-name auto-select: as the cashier types, suggest matching
  // past customers (built from bill history) so a tap can fill in name,
  // phone, and address together instead of retyping them for a repeat
  // customer. Cheap enough to run on every keystroke, same as the item
  // search filter above — no debounce, no full re-render.
  function custSuggestMatches(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    return buildCustomerStats()
      .filter(function(c){ return c.name.toLowerCase().indexOf(q)>=0; })
      .sort(function(a,b){ return new Date(b.lastDateISO)-new Date(a.lastDateISO); })
      .slice(0,6);
  }

  function updateCustSuggestions(){
    var box = document.getElementById('cust-name-suggest');
    if(!box) return;
    var matches = custSuggestMatches(state.customerName);
    if(!matches.length){ box.classList.remove('open'); box.innerHTML=''; return; }
    box.innerHTML = matches.map(function(c){
      return '<div class="suggest-item" data-suggest-name="'+escapeHtml(c.name)+'">'+
        '<span class="snm">'+escapeHtml(c.name)+'</span>'+
        (c.phone ? '<span class="sph">'+escapeHtml(c.phone)+'</span>' : '')+
      '</div>';
    }).join('');
    box.classList.add('open');
    box.querySelectorAll('[data-suggest-name]').forEach(function(row){
      // mousedown+preventDefault (not click) so this fires and fills the
      // fields before the input's blur handler can close the dropdown.
      row.addEventListener('mousedown', function(e){
        e.preventDefault();
        var match = buildCustomerStats().find(function(c){ return c.name===row.getAttribute('data-suggest-name'); });
        if(!match) return;
        state.customerName = match.name;
        state.customerPhone = match.phone||'';
        state.customerAddress = match.address||'';
        var nameEl = document.getElementById('cust-name'); if(nameEl) nameEl.value = state.customerName;
        var phoneEl = document.getElementById('cust-phone'); if(phoneEl) phoneEl.value = state.customerPhone;
        var addrEl = document.getElementById('cust-address'); if(addrEl) addrEl.value = state.customerAddress;
        box.classList.remove('open'); box.innerHTML='';
      });
    });
  }

  // Only re-binds controls inside #cart-body — safe to call after
  // refreshCartBody() replaces just that region's innerHTML.
  function bindCartBodyEvents(){
    document.querySelectorAll('[data-qty]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-id');
        var delta = Number(btn.getAttribute('data-qty'));
        var line = state.cart.find(function(c){ return c.id===id; });
        var item = state.items.find(function(i){ return i.id===id; });
        if(!line) return;
        var newQty = line.qty + delta;
        if(newQty<=0){ state.cart = state.cart.filter(function(c){ return c.id!==id; }); }
        else if(item && newQty>item.stock){ /* cap at stock */ }
        else { line.qty = newQty; }
        refreshCartBody();
      });
    });

    document.querySelectorAll('[data-qty-input]').forEach(function(inp){
      function commit(){
        var id = inp.getAttribute('data-qty-input');
        var line = state.cart.find(function(c){ return c.id===id; });
        var item = state.items.find(function(i){ return i.id===id; });
        if(!line) return;
        var newQty = parseInt(inp.value, 10);
        if(!newQty || newQty<=0){ state.cart = state.cart.filter(function(c){ return c.id!==id; }); refreshCartBody(); return; }
        if(item && newQty>item.stock) newQty = item.stock;
        line.qty = newQty;
        refreshCartBody();
      }
      inp.addEventListener('change', commit);
      inp.addEventListener('blur', commit);
      inp.addEventListener('keydown', function(e){ if(e.key==='Enter'){ inp.blur(); } });
    });

    document.querySelectorAll('[data-remove]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-remove');
        state.cart = state.cart.filter(function(c){ return c.id!==id; });
        refreshCartBody();
      });
    });

    var dt = document.getElementById('disc-type');
    if(dt) dt.addEventListener('change', function(e){ state.discountType = e.target.value; updateCartTotals(); });
    var dv = document.getElementById('disc-val');
    if(dv) dv.addEventListener('input', function(e){ state.discountVal = e.target.value; updateCartTotals(); });

    document.querySelectorAll('[data-pay]').forEach(function(btn){
      btn.addEventListener('click', function(){ state.payment = btn.getAttribute('data-pay'); refreshCartBody(); });
    });
    var cq = document.getElementById('cheque-no');
    if(cq) cq.addEventListener('input', function(e){ state.chequeNo = e.target.value; });
    var apn = document.getElementById('acct-paid-now');
    if(apn) apn.addEventListener('input', function(e){ state.accountPaidNow = e.target.value; });
    var cn = document.getElementById('cust-name');
    if(cn){
      cn.addEventListener('input', function(e){ state.customerName = e.target.value; updateCustSuggestions(); });
      cn.addEventListener('focus', function(){ updateCustSuggestions(); });
      cn.addEventListener('blur', function(){
        // Small delay so a tap on a suggestion (mousedown, above) still
        // lands before the dropdown gets closed here.
        setTimeout(function(){
          var box = document.getElementById('cust-name-suggest');
          if(box){ box.classList.remove('open'); box.innerHTML=''; }
        }, 150);
      });
    }
    var cp = document.getElementById('cust-phone');
    if(cp) cp.addEventListener('input', function(e){ state.customerPhone = e.target.value; });
    var ca = document.getElementById('cust-address');
    if(ca) ca.addEventListener('input', function(e){ state.customerAddress = e.target.value; });

    var complete = document.getElementById('complete-bill');
    if(complete) complete.addEventListener('click', completeBill);
    var pStatus = document.getElementById('cart-printer-status');
    if(pStatus) pStatus.addEventListener('click', function(){ state.printerModalOpen = true; render(); });
  }

  // Guards completeBill against a second tap landing while the first bill
  // is still being saved/printed — the button also gets disabled the
  // instant it's tapped, but this flag is the real safety net since the
  // button element itself may briefly still be in the DOM.
  var billSubmitInProgress = false;

  async function completeBill(){
    if(billSubmitInProgress) return;
    if(state.cart.length===0) return;
    if(state.payment==='account' && !state.customerName.trim()){
      alert('Customer name is required for "on account" sales.');
      return;
    }
    billSubmitInProgress = true;
    var btn = document.getElementById('complete-bill');
    if(btn){ btn.disabled = true; btn.textContent = 'Processing…'; }
    try{
      var totals = currentTotals();
      // For cash/cheque sales the full amount is settled immediately. For
      // "account" (credit) sales, whatever is entered in "amount received
      // now" is recorded as a payment and the rest becomes the balance due,
      // tracked on the Accounts page.
      var paidNow = state.payment==='account'
        ? Math.max(0, Math.min(totals.total, Math.round((Number(state.accountPaidNow)||0)*100)/100))
        : totals.total;
      var bill = {
        id: uid('bill'),
        no: (state.shop.billPrefix||'AJ')+String((parseInt(state.shop.billStart,10)||1)+state.bills.length).padStart(4,'0'),
        dateISO: new Date().toISOString(),
        cashier: state.currentUser.name,
        items: state.cart.map(function(c){
          var item = state.items.find(function(i){ return i.id===c.id; });
          // Consuming stock here (instead of in the loop below) also
          // records the exact cost of the batches this sale drew from,
          // so profit stays accurate even if purchase prices change later.
          var cost = item ? consumeStockFIFO(item, c.qty) : 0;
          return {name:c.name, price:c.price, qty:c.qty, cost:cost};
        }),
        subtotal: totals.subtotal,
        discount: totals.discount,
        total: totals.total,
        payment: state.payment,
        chequeNo: state.payment==='cheque' ? state.chequeNo : '',
        customer: state.payment==='account' ? state.customerName : '', // kept for backward compatibility
        customerName: state.customerName.trim(),
        customerPhone: state.customerPhone.trim(),
        customerAddress: state.customerAddress.trim(),
        payments: paidNow>0 ? [{id:uid('pay'), dateISO:new Date().toISOString(), amount:paidNow, note:'Payment at time of sale', receivedBy: state.currentUser.name}] : []
      };
      state.bills.push(bill);
      // items and bills used to be saved in parallel (Promise.all), which
      // meant every single sale sent two requests that both needed the
      // same Apps Script lock at once — after weeks of bills piling up,
      // the "bills" value cell is large enough that writing it can eat
      // most of the lock-wait window, so the request running alongside it
      // (items) kept timing out. Saving them one after another instead
      // means only one request ever needs the lock at a time.
      var itemsOk = await persist('items');
      var billsOk = await persist('bills');
      var persistResults = [itemsOk, billsOk];
      // persist() returns false (not a thrown error) on failure, so a bad
      // save here was previously indistinguishable from a good one — the
      // bill still showed/printed as if everything was fine even though
      // it never reached the Sheet. Surface that instead of hiding it.
      state.lastBillSyncFailed = persistResults.indexOf(false) !== -1;
      state.lastBill = bill;
      state.cart = [];
      state.discountVal = 0;
      state.chequeNo = '';
      state.customerName = '';
      state.customerPhone = '';
      state.customerAddress = '';
      state.accountPaidNow = 0;
      state.showReceipt = true;
      render();
      if(printingEnabled()){
        if(state.printer.connected){
          await printBillToBluetooth(bill);
        } else {
          // Give the browser a paint frame to show the receipt before
          // opening the print dialog, without a blocking overlay.
          requestAnimationFrame(function(){
            requestAnimationFrame(function(){ window.print(); });
          });
        }
      }
    } finally {
      billSubmitInProgress = false;
    }
  }

  // ---------------- ACCOUNTS ----------------
  // How many units of a bill line item are still eligible to be returned
  // (original qty minus whatever's already been returned against it).
  function billItemRemainingQty(it){
    return Math.max(0, (Number(it.qty)||0) - (Number(it.returned)||0));
  }
  function billHasReturnableQty(b){
    return (b.items||[]).some(function(it){ return billItemRemainingQty(it) > 0.004; });
  }

  function renderAccounts(){
    var q = (state.acctSearch||'').toLowerCase();
    var tab = state.acctTab === 'today' ? 'today' : 'credit';
    var todayStr = todayISO();
    var dateFrom = state.acctDateFrom || '';
    var dateTo = state.acctDateTo || '';
    var hasDateFilter = !!(dateFrom || dateTo);

    function inDateRange(b){
      var day = localDay(b.dateISO);
      if(dateFrom && day < dateFrom) return false;
      if(dateTo && day > dateTo) return false;
      return true;
    }

    var allAcct = state.bills.filter(function(b){ return b.payment==='account'; });
    var totalOutstanding = allAcct.reduce(function(s,b){ return s+billBalance(b); },0);
    var owingNames = {};
    allAcct.forEach(function(b){ if(billBalance(b)>0.004) owingNames[b.customerName||'(no name)'] = true; });
    var custCount = Object.keys(owingNames).length;

    // "Collected" defaults to today (original behaviour) when no date
    // filter is set; once a From/To date is picked, it reflects payments
    // received within that range instead.
    var collFrom = hasDateFilter ? dateFrom : todayStr;
    var collTo = hasDateFilter ? dateTo : todayStr;
    var collectedAmt = 0;
    var collectedList = [];
    state.bills.forEach(function(b){
      if(b.payment!=='account') return;
      (b.payments||[]).forEach(function(p){
        var day = localDay(p.dateISO);
        if(collFrom && day < collFrom) return;
        if(collTo && day > collTo) return;
        collectedAmt += p.amount;
        collectedList.push({billNo:b.no, billId:b.id, custName:b.customerName||'(no name)', custPhone:b.customerPhone||'', amount:p.amount, dateISO:p.dateISO, note:p.note||'', payId:p.id});
      });
    });
    collectedList.sort(function(a,c){ return new Date(c.dateISO)-new Date(a.dateISO); });
    var collectedLabel = hasDateFilter ? ('Collected ('+escapeHtml(dateFrom||'…')+' &rarr; '+escapeHtml(dateTo||'…')+')') : 'Collected Today';

    // "All Bills" now really means all bills (any date), not just today's —
    // use the date range below to narrow it down to a specific day or period.
    var baseBills = (tab==='today' ? state.bills.slice() : allAcct.slice()).filter(inDateRange);

    var listBills = baseBills;
    if(q){
      listBills = listBills.filter(function(b){
        var dateStr = new Date(b.dateISO).toLocaleDateString().toLowerCase();
        return (b.customerName||'').toLowerCase().indexOf(q)>=0 ||
          (b.customerPhone||'').toLowerCase().indexOf(q)>=0 ||
          b.no.toLowerCase().indexOf(q)>=0 ||
          dateStr.indexOf(q)>=0;
      });
    }
    listBills = listBills.slice().sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); });

    var rows = listBills.map(renderAccountBillRow).join('');

    var shownTotal = tab==='today' ? listBills.reduce(function(s,b){ return s+b.total; },0) : 0;

    var tabsHtml = '<div class="pay-tabs" style="max-width:340px;">'+
      '<button class="pay-tab '+(tab==='today'?'active':'')+'" data-acct-tab="today">All Bills</button>'+
      '<button class="pay-tab '+(tab==='credit'?'active':'')+'" data-acct-tab="credit">Credit (Account)</button>'+
    '</div>';

    var statsHtml = tab==='today'
      ? ''
      : '<div class="stat-grid">'+
          '<div class="stat-card accent"><div class="lbl">Total Outstanding</div><div class="val">'+money(totalOutstanding)+'</div></div>'+
          '<div class="stat-card"><div class="lbl">Customers owing</div><div class="val">'+custCount+'</div></div>'+
          '<div class="stat-card"><div class="lbl">'+collectedLabel+'</div><div class="val">'+money(collectedAmt)+'</div></div>'+
        '</div>';

    var collectedRowsHtml = collectedList.map(function(p){
      return '<tr>'+
        '<td>'+escapeHtml(p.billNo)+'</td>'+
        '<td>'+new Date(p.dateISO).toLocaleString()+'</td>'+
        '<td>'+escapeHtml(p.custName)+(p.custPhone?' <span style="color:var(--text-dim);font-size:11.5px;">('+escapeHtml(p.custPhone)+')</span>':'')+'</td>'+
        '<td class="num">'+money(p.amount)+'</td>'+
        '<td>'+escapeHtml(p.note||'&mdash;')+'</td>'+
        '<td style="white-space:nowrap;">'+
          '<button class="btn btn-ghost btn-sm" data-print-payment="'+p.billId+'|'+p.payId+'" style="margin-right:4px;">&#128424; Receipt</button>'+
          '<button class="btn btn-amber btn-sm" data-return-payment="'+p.billId+'|'+p.payId+'" style="margin-right:4px;" title="Reverse this payment — money returned to customer">&#8617; Return</button>'+
          (canDeleteBills() ? '<button class="btn btn-danger btn-sm" data-delete-payment="'+p.billId+'|'+p.payId+'" title="Delete this payment — use only if recorded in error">&#128465; Delete</button>' : '')+
        '</td>'+
      '</tr>';
    }).join('');

    var collectedListHtml = tab==='today' ? '' :
      '<div class="card" style="margin-top:16px;"><div class="section-head"><h3>'+collectedLabel+' &mdash; Payments ('+collectedList.length+')</h3></div>'+
      (collectedRowsHtml
        ? '<table><thead><tr><th>Bill</th><th>Date &amp; Time</th><th>Customer</th><th>Amount</th><th>Note</th><th></th></tr></thead><tbody>'+collectedRowsHtml+'</tbody></table>'
        : '<div class="empty-note">No payments collected '+(hasDateFilter?'in this date range':'today')+' yet.</div>')+
      '</div>';

    var emptyMsg = tab==='today'
      ? ('No bills'+((q||hasDateFilter)?' match this search/date filter.':' yet.'))
      : ('No account (credit) bills'+((q||hasDateFilter)?' match this search/date filter.':' yet. Sell something with payment type &quot;Account&quot; to see it here.'));

    var dateFilterHtml = '<div class="date-select-bar" style="margin-top:8px;">'+
      '<div class="field"><label>Select date</label><input type="date" id="acct-sel-date" value="'+escapeHtml(dateFrom===dateTo ? dateFrom : '')+'"></div>'+
      '<button class="btn btn-primary btn-sm" id="acct-sel-date-today" type="button">Today</button>'+
    '</div>'+
    '<div class="form-row" style="margin-top:8px;align-items:flex-end;">'+
      '<div class="field"><label>From date</label><input type="date" id="acct-date-from" value="'+escapeHtml(dateFrom)+'"></div>'+
      '<div class="field"><label>To date</label><input type="date" id="acct-date-to" value="'+escapeHtml(dateTo)+'"></div>'+
      '<button class="btn btn-ghost btn-sm" id="acct-date-clear" type="button">Clear dates</button>'+
    '</div>';

    return ''+
      '<h1 class="page-title">Bills</h1><p class="page-sub">'+(tab==='today' ? 'Every bill, across every payment type — search or filter by date below.' : 'Credit (on account) bills — receive payments, track balances, and fix mistakes.')+'</p>'+
      pageActionsHtml()+
      tabsHtml+
      statsHtml+
      collectedListHtml+
      '<div class="search-row"><input id="acct-search" placeholder="Search by customer, phone, bill no., or date…" value="'+escapeHtml(state.acctSearch||'')+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"></div>'+
      dateFilterHtml+
      (rows || '<div class="empty-note">'+emptyMsg+'</div>')+
      renderEditModal()+
      renderReturnModal()+
      renderReceivePaymentModal();
  }

  function billPayments_(b){
    var list = b.payments || [];
    if(!list.length) return '';
    var rows = list.slice().reverse().map(function(p){
      var methodLbl = p.note==='Payment at time of sale' ? '' : (' ('+((p.method==='cheque')?'Cheque':'Cash')+')');
      return '<div class="sum-row" style="font-size:12px;"><span>'+new Date(p.dateISO).toLocaleDateString()+' &mdash; '+escapeHtml(p.note||'Payment')+methodLbl+'</span>'+
        '<span class="val">'+money(p.amount)+
        (printingEnabled() ? ' <button class="btn btn-ghost btn-sm" data-print-payment="'+b.id+'|'+p.id+'" style="margin-left:6px;padding:2px 8px;min-height:0;font-size:11px;">Receipt</button>' : '')+
        '</span></div>';
    }).join('');
    return '<div style="margin-top:6px;padding-top:6px;border-top:1px dashed var(--line);">'+rows+'</div>';
  }

        '</div>'+

        '<div style="max-height:38vh;overflow-y:auto;">'+

        '</div>'+

  function bindAccountsEvents(){
    var s = document.getElementById('acct-search');
    if(s) s.addEventListener('input', function(e){ state.acctSearch = e.target.value; renderDebounced(); });

    var selDate = document.getElementById('acct-sel-date');
    if(selDate) selDate.addEventListener('change', function(e){
      state.acctDateFrom = e.target.value || '';
      state.acctDateTo = e.target.value || '';
      render();
    });
    var selDateToday = document.getElementById('acct-sel-date-today');
    if(selDateToday) selDateToday.addEventListener('click', function(){
      var t = todayISO();
      state.acctDateFrom = t;
      state.acctDateTo = t;
      render();
    });

    var dFrom = document.getElementById('acct-date-from');
    if(dFrom) dFrom.addEventListener('change', function(e){ state.acctDateFrom = e.target.value; render(); });
    var dTo = document.getElementById('acct-date-to');
    if(dTo) dTo.addEventListener('change', function(e){ state.acctDateTo = e.target.value; render(); });
    var dClear = document.getElementById('acct-date-clear');
    if(dClear) dClear.addEventListener('click', function(){ state.acctDateFrom=''; state.acctDateTo=''; render(); });

    document.querySelectorAll('[data-acct-tab]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var next = btn.getAttribute('data-acct-tab');
        if(state.acctTab===next) return;
        state.acctTab = next;
        state.payFormOpenId = null;
        state.billEditForm = null;
        state.returnForm = null;
        render();
      });
    });

    document.querySelectorAll('[data-toggle-pay]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-toggle-pay');
        state.payFormOpenId = (state.payFormOpenId===id) ? null : id;
        state.payFormMethod = 'cash';
        state.billEditForm = null;
        state.returnForm = null;
        render();
      });
    });
    document.querySelectorAll('[data-pay-method]').forEach(function(btn){
      btn.addEventListener('click', function(){
        state.payFormMethod = btn.getAttribute('data-pay-method');
        // Toggle active class in place rather than a full render(), so an
        // amount the user has already typed into the input isn't wiped out
        // by the input's value attribute being re-stamped from the bill
        // balance on every render.
        var group = btn.parentNode;
        if(group) group.querySelectorAll('[data-pay-method]').forEach(function(b2){
          b2.classList.toggle('active', b2===btn);
        });
      });
    });
    function closePayModal(){ state.payFormOpenId = null; state.payFormMethod = 'cash'; render(); }
    var payCancel = document.getElementById('pay-cancel');
    if(payCancel) payCancel.addEventListener('click', closePayModal);
    var payClose = document.getElementById('pay-close');
    if(payClose) payClose.addEventListener('click', closePayModal);
    var payBg = document.getElementById('pay-modal-bg');
    if(payBg) payBg.addEventListener('click', function(e){ if(e.target===payBg) closePayModal(); });
    document.querySelectorAll('[data-pay-quick]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-pay-quick-id');
        var input = document.getElementById('pay-amt-'+id);
        if(!input) return;
        var bill = state.bills.find(function(b){ return b.id===id; });
        if(!bill) return;
        var bal = billBalance(bill);
        input.value = btn.getAttribute('data-pay-quick')==='full' ? bal : Math.round((bal/2)*100)/100;
        input.focus();
      });
    });
    document.querySelectorAll('[data-record-pay]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var id = btn.getAttribute('data-record-pay');
        var input = document.getElementById('pay-amt-'+id);
        var amount = Math.round((Number(input.value)||0)*100)/100;
        if(amount<=0) return;
        var bill = state.bills.find(function(b){ return b.id===id; });
        if(!bill) return;
        var bal = billBalance(bill);
        if(amount>bal+0.01 && !confirm('This amount ('+money(amount)+') is more than the balance due ('+money(bal)+'). Record it anyway?')) return;
        bill.payments = bill.payments || [];
        var method = state.payFormMethod==='cheque' ? 'cheque' : 'cash';
        var newPayment = {id:uid('pay'), dateISO:new Date().toISOString(), amount:amount, note:'Payment received', method:method, receivedBy: state.currentUser.name};
        bill.payments.push(newPayment);
        var printingNow = printingEnabled();
        if(printingNow){
          btn.disabled = true;
          btn.textContent = 'Printing…';
        }
        await persist('bills');
        state.payFormOpenId = null;
        state.payFormMethod = 'cash';
        state.lastPayment = {billId: bill.id, paymentId: newPayment.id};
        state.showPaymentReceipt = true;
        render();
        if(printingNow){
          var ctx = findPaymentContext(bill.id, newPayment.id);
          if(state.printer.connected){
            await printPaymentReceiptToBluetooth(ctx);
          } else {
            requestAnimationFrame(function(){
              requestAnimationFrame(function(){ window.print(); });
            });
          }
        }
      });
    });
    document.querySelectorAll('[data-print-payment]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var parts = btn.getAttribute('data-print-payment').split('|');
        state.lastPayment = {billId: parts[0], paymentId: parts[1]};
        state.showPaymentReceipt = true;
        render();
      });
    });

    // Return payment — reverses the collection (restores the balance due on the bill).
    // Use when the shop has physically returned the money to the customer.
    document.querySelectorAll('[data-return-payment]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var parts = btn.getAttribute('data-return-payment').split('|');
        var billId = parts[0], payId = parts[1];
        var bill = state.bills.find(function(b){ return b.id===billId; });
        if(!bill) return;
        var payment = (bill.payments||[]).find(function(p){ return p.id===payId; });
        if(!payment) return;
        if(!confirm('Return payment of '+money(payment.amount)+' on bill '+bill.no+'?\n\nThis restores the balance due on the bill. Use this when money has been physically returned to the customer.')) return;
        bill.payments = (bill.payments||[]).filter(function(p){ return p.id!==payId; });
        state.busyMsg = 'Returning payment…';
        render();
        await persist('bills');
        state.busyMsg = '';
        render();
      });
    });

    // Delete payment — removes a payment recorded in error. Does not imply money
    // was physically returned; use only when the record itself is a mistake.
    document.querySelectorAll('[data-delete-payment]').forEach(function(btn){
      btn.addEventListener('click', async function(){
        var parts = btn.getAttribute('data-delete-payment').split('|');
        var billId = parts[0], payId = parts[1];
        var bill = state.bills.find(function(b){ return b.id===billId; });
        if(!bill) return;
        var payment = (bill.payments||[]).find(function(p){ return p.id===payId; });
        if(!payment) return;
        if(!confirm('Delete payment of '+money(payment.amount)+' from bill '+bill.no+'?\n\nUse only if this was recorded in error. This cannot be undone.')) return;
        bill.payments = (bill.payments||[]).filter(function(p){ return p.id!==payId; });
        state.busyMsg = 'Deleting payment…';
        render();
        await persist('bills');
        state.busyMsg = '';
        render();
      });
    });

    document.querySelectorAll('[data-toggle-edit]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-toggle-edit');
        if(state.billEditForm && state.billEditForm.billId===id){ state.billEditForm=null; render(); return; }
        var bill = state.bills.find(function(b){ return b.id===id; });
        if(!bill) return;
        state.billEditForm = {
          billId: id,
          customerName: bill.customerName||'',
          customerPhone: bill.customerPhone||'',
          customerAddress: bill.customerAddress||'',
          discount: bill.discount||0,
          items: bill.items.map(function(it){ return {name:it.name, qty:it.qty, price:it.price}; })
        };
        state.payFormOpenId = null;
        state.returnForm = null;
        render();
      });
    });

    document.querySelectorAll('[data-toggle-return]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.getAttribute('data-toggle-return');

    function captureReturnFields(){
      if(!state.returnForm) return;
      document.querySelectorAll('[data-ridx]').forEach(function(inp){

    }

    if(retReasonEl) retReasonEl.addEventListener('input', function(){ state.returnForm.reason = retReasonEl.value; });

    document.querySelectorAll('[data-rdec]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = btn.getAttribute('data-rdec');
        var inp = document.querySelector('[data-ridx="'+idx+'"]');
        if(!inp) return;
        var next = Math.max(0, (parseInt(inp.value,10)||0) - 1);
        inp.value = next;
        captureReturnFields();
      });
    });
    document.querySelectorAll('[data-rinc]').forEach(function(btn){
      btn.addEventListener('click', function(){
        var idx = btn.getAttribute('data-rinc');
        var inp = document.querySelector('[data-ridx="'+idx+'"]');
        if(!inp) return;
        var max = parseInt(inp.getAttribute('max'),10);
        var next = (parseInt(inp.value,10)||0) + 1;
        if(!isNaN(max)) next = Math.min(max, next);
        inp.value = next;
        captureReturnFields();
      });
    });

    function closeReturnModal(){ state.returnForm=null; render(); }
    var retCancel = document.getElementById('ret-cancel');
    if(retCancel) retCancel.addEventListener('click', closeReturnModal);
    var retClose = document.getElementById('ret-close');
    if(retClose) retClose.addEventListener('click', closeReturnModal);
    var retBg = document.getElementById('return-modal-bg');
    if(retBg) retBg.addEventListener('click', function(e){ if(e.target===retBg) closeReturnModal(); });

    var retSave = document.getElementById('ret-save');
    if(retSave) retSave.addEventListener('click', async function(){
      captureReturnFields();
      var f = state.returnForm;
      if(!f) return;
      var bill = state.bills.find(function(b){ return b.id===f.billId; });
      if(!bill){ state.returnForm=null; render(); return; }
      var returnedItems = [];
      var anyInvalid = false;
      (bill.items||[]).forEach(function(it, idx){
        var qty = Math.floor(Number(f.qtys[idx])||0);
        if(qty<=0) return;
        var remaining = billItemRemainingQty(it);
        if(qty > remaining + 0.0001){ anyInvalid = true; qty = remaining; }
        if(qty<=0) return;
        returnedItems.push({name:it.name, qty:qty, price:it.price});
      });
      if(returnedItems.length===0){ alert('Enter a quantity to return for at least one item.'); return; }
      if(anyInvalid) alert('One or more quantities were more than what is left to return - reduced to the maximum available.');
      if(!confirm('Confirm return of '+returnedItems.reduce(function(s,it){return s+it.qty;},0)+' item(s) from bill '+bill.no+'? Returned quantities will be added back to stock and the bill total reduced.')) return;

      var oldTotal = bill.total;
      // Apply the return against the bill's line items and restock each item.
      returnedItems.forEach(function(ret){
        var lineIdx = (bill.items||[]).findIndex(function(it){ return it.name===ret.name && it.price===ret.price; });
        if(lineIdx>=0){
          bill.items[lineIdx].returned = (Number(bill.items[lineIdx].returned)||0) + ret.qty;
        }
        var stockItem = state.items.find(function(i){ return i.name===ret.name; });
        if(stockItem){
          ensureItemBatches(stockItem);
          var cost = itemLastPurchasePrice(stockItem);
          stockItem.batches.push({id:uid('b'), qty:ret.qty, purchasePrice: cost!=null?cost:0, dateISO:new Date().toISOString()});
          stockItem.stock = (stockItem.stock||0) + ret.qty;
        }
      });
      // Recompute the bill's active (non-returned) totals.
      var newSubtotal = (bill.items||[]).reduce(function(s,it){ return s + billItemRemainingQty(it)*it.price; },0);
      bill.subtotal = Math.round(newSubtotal*100)/100;
      bill.discount = Math.min(bill.discount||0, bill.subtotal);
      bill.total = Math.round((bill.subtotal - bill.discount)*100)/100;
      var refundAmount = Math.round((oldTotal - bill.total)*100)/100;

      state.returns = state.returns || [];
      state.returns.push({
        id: uid('ret'), dateISO: new Date().toISOString(), type:'bill',
        billId: bill.id, billNo: bill.no, customerName: bill.customerName||'',
        items: returnedItems, amount: refundAmount, reason: (f.reason||'').trim(),
        processedBy: state.currentUser.name
      });

      state.returnForm = null;
      retSave.disabled = true;
      retSave.textContent = 'Returning…';
      await persist('bills'); await persist('items'); await persist('returns');
      render();
    });

    function captureEditFields(){
      if(!state.billEditForm) return;

    });

    var eSave = document.getElementById('e-save');
    if(eSave) eSave.addEventListener('click', async function(){
      captureEditFields();
      var f = state.billEditForm;
      var bill = state.bills.find(function(b){ return b.id===f.billId; });
      if(!bill){ state.billEditForm=null; render(); return; }
      var subtotal = f.items.reduce(function(s,it){ return s + (Number(it.qty)||0)*(Number(it.price)||0); },0);
      var discount = Math.min(Number(f.discount)||0, subtotal);
      bill.items = f.items;
      bill.subtotal = subtotal;
      bill.discount = discount;
      bill.total = subtotal - discount;
      bill.customerName = f.customerName.trim();
      bill.customerPhone = f.customerPhone.trim();
      bill.customerAddress = f.customerAddress.trim();
      if(bill.payment==='account') bill.customer = bill.customerName;
      eSave.disabled = true;
      eSave.textContent = 'Saving…';
      await persist('bills');
      state.billEditForm = null;
      render();
    });
    function closeEditModal(){ state.billEditForm=null; render(); }

  // ---------------- CUSTOMERS ----------------
  // Built entirely from bill history — every customer name ever entered
  // on a bill, with their most recent phone/address, how much they've
  // spent in total, and any outstanding balance from account (credit) bills.
  function buildCustomerStats(){
    var map = {};
    state.bills.forEach(function(b){
      var name = (b.customerName||'').trim();
      if(!name) return;
      var key = name.toLowerCase();
      if(!map[key]) map[key] = {name:name, phone:'', address:'', bills:[], totalSpent:0, totalBalance:0, lastDateISO:b.dateISO};
      var c = map[key];
      c.bills.push(b);
      c.totalSpent += b.total;
      c.totalBalance += billBalance(b);
      if(b.customerPhone) c.phone = b.customerPhone;
      if(b.customerAddress) c.address = b.customerAddress;
      if(new Date(b.dateISO) > new Date(c.lastDateISO)) c.lastDateISO = b.dateISO;
    });
    return Object.keys(map).map(function(k){ return map[k]; });
  }

  // ---------------- STOCK ----------------
  // ---------------- STOCK IN/OUT + BILLS SUMMARY ----------------
  // Every batch (restock or original opening stock) is a stock-IN
  // movement; every line on every bill is a stock-OUT movement.
  function buildStockMovements(){
    var moves = [];
    state.items.forEach(function(it){
      ensureItemBatches(it);
      (it.batches||[]).forEach(function(b){
        moves.push({dateISO:b.dateISO, itemName:it.name, qty:b.qty, type:'in'});
      });
    });
    state.bills.forEach(function(b){
      (b.items||[]).forEach(function(li){
        moves.push({dateISO:b.dateISO, itemName:li.name, qty:li.qty, type:'out'});
      });
    });
    return moves;
  }

  // Reconstructs each item's stock level as it stood at the start and end
  // of the selected date, by walking back from the item's current stock:
  //  closing stock (end of day) = current stock − net IN/OUT after that day
  //  opening stock (start of day) = closing stock − net IN/OUT during that day
  function stockOpenCloseByDate(date){
    date = date || todayISO();
    var moves = buildStockMovements();
    var perItem = {};
    function ensure(name){ if(!perItem[name]) perItem[name] = {netAfter:0, netOnDate:0, inOnDate:0, outOnDate:0}; return perItem[name]; }
    moves.forEach(function(m){
      var day = localDay(m.dateISO);
      var e = ensure(m.itemName);
      var signed = m.type==='in' ? m.qty : -m.qty;
      if(day > date) e.netAfter += signed;
      else if(day === date){
        e.netOnDate += signed;
        if(m.type==='in') e.inOnDate += m.qty; else e.outOnDate += m.qty;
      }
    });
    return state.items.map(function(it){
      var e = perItem[it.name] || {netAfter:0, netOnDate:0, inOnDate:0, outOnDate:0};
      var closing = (it.stock||0) - e.netAfter;
      var opening = closing - e.netOnDate;
      return {
        id: it.id, name: it.name, category: it.category||'',
        opening: opening, closing: closing,
        inQty: e.inOnDate, outQty: e.outOnDate,
        current: it.stock||0
      };
    });
  }

  // ---------------- REPORTS ----------------
  function billsInRange(range){
    var now = new Date();
    return state.bills.filter(function(b){
      var d = new Date(b.dateISO);
      if(range==='today') return localDay(b.dateISO)===todayISO();
      if(range==='month') return monthKey(b.dateISO)===monthKey(now.toISOString());
      return true;
    });
  }

  function billItemCount(b){ return b.items.reduce(function(s,it){ return s+it.qty; },0); }

  // Bills matching the current date-range + payment-method filters on the Reports page.
  function filteredReportBills(){
    return state.bills.filter(function(b){
      var day = localDay(b.dateISO);
      if(state.reportFrom && day < state.reportFrom) return false;
      if(state.reportTo && day > state.reportTo) return false;
      if(state.reportPayment!=='all' && b.payment!==state.reportPayment) return false;
      return true;
    });
  }

  function groupBillsByDay(bills){
    var map = {};
    bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(!map[day]) map[day] = {date:day, bills:[], total:0, itemsSold:0, cash:0, cheque:0, credit:0};
      map[day].bills.push(b);
      map[day].total += b.total;
      map[day].itemsSold += billItemCount(b);
      if(b.payment==='cash') map[day].cash += b.total;
      else if(b.payment==='cheque') map[day].cheque += b.total;
      else if(b.payment==='account') map[day].credit += b.total;
    });
    return Object.keys(map).sort().reverse().map(function(k){ return map[k]; });
  }

  function topItemsSummary(bills, limit){
    var map = {};
    bills.forEach(function(b){
      b.items.forEach(function(it){
        if(!map[it.name]) map[it.name] = {name:it.name, qty:0, revenue:0};
        map[it.name].qty += it.qty;
        map[it.name].revenue += it.price*it.qty;
      });
    });
    return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){ return b.qty-a.qty; }).slice(0, limit||5);
  }

  // Cash sales that day, plus any payments received against account
  // balances that day (split by how each payment was recorded — Cash or
  // Cheque), respecting the reports date range but not the payment-type
  // filter.
  function dailyCashSummary(){
    var from = state.reportFrom, to = state.reportTo;
    var inRange = function(day){ if(from && day<from) return false; if(to && day>to) return false; return true; };
    var map = {};
    function ensure(day){ if(!map[day]) map[day] = {date:day, cash:0, cheque:0, credit:0, received:0, receivedCheque:0}; return map[day]; }
    state.bills.forEach(function(b){
      var day = localDay(b.dateISO);
      if(!inRange(day)) return;
      var e = ensure(day);
      if(b.payment==='cash') e.cash += b.total;
      else if(b.payment==='cheque') e.cheque += b.total;
      else if(b.payment==='account') e.credit += b.total;
    });
    state.bills.forEach(function(b){
      if(b.payment!=='account') return; // only credit-sale collections count as "received"; cash/cheque bills also carry a payments[] entry for the sale itself, which would otherwise be double-counted here
      (b.payments||[]).forEach(function(p){
        var day = localDay(p.dateISO);
        if(!inRange(day)) return;
        if(p.note!=='Payment at time of sale' && p.method==='cheque'){
          ensure(day).receivedCheque += p.amount;
        } else {
          ensure(day).received += p.amount;
        }
      });
    });
    return Object.keys(map).sort().reverse().map(function(k){
      var r = map[k];
      r.cheque += r.receivedCheque;
      r.cashOnHand = r.cash + r.received;
      return r;
    });
  }

  function setReportPreset(preset){
    if(preset==='today'){ state.reportFrom = todayISO(); state.reportTo = todayISO(); }
    else if(preset==='week'){
      var w = new Date(todayISO()+'T00:00:00Z');
      w.setUTCDate(w.getUTCDate()-6);
      state.reportFrom = w.toISOString().slice(0,10);
      state.reportTo = todayISO();
    }
    else if(preset==='month'){ state.reportFrom = todayISO().slice(0,8)+'01'; state.reportTo = todayISO(); }
    else { state.reportFrom=''; state.reportTo=''; }
  }

  // Old-bill search: matches by bill number, customer name or customer phone.
  // Returns the most recent 25 matches so the list stays fast and scannable.
  function billFindMatches(q){
    q = (q||'').trim().toLowerCase();
    if(!q) return [];
    var matches = state.bills.filter(function(b){
      return b.no.toLowerCase().indexOf(q)>=0 ||
        (b.customerName||'').toLowerCase().indexOf(q)>=0 ||
        (b.customerPhone||'').toLowerCase().indexOf(q)>=0;
    });
    matches.sort(function(a,b){ return new Date(b.dateISO)-new Date(a.dateISO); });
    return matches.slice(0,25);
  }
